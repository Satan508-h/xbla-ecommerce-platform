# ============================================================
# Nginx 站点配置 —— 阶段 8
#
# 【整体拓扑】
#
#   外部用户
#      │
#      ▼  cpolar 隧道（只转发 80）
#   Nginx :80
#      ├── /api/chat/stream  → app:8080   ★ SSE 专用块（本文件最重要的地方）
#      ├── /api/              → app:8080
#      ├── /docs/             → 容器内的静态目录（只有两张报告）
#      └── /                  → Vue 构建产物
#
# 【★★★ 为什么 SSE 要单独一块：默认配置会把它「攒起来」】
#
#   Nginx 默认开启 proxy_buffering —— 它会把上游的响应攒够一个 buffer
#   再发给客户端（那是为了让慢客户端不拖累上游，对普通请求是好事）。
#
#   而 SSE 要的恰恰相反：**每收到一小段就立刻转发**。
#   被缓冲时的症状是：
#
#       前端一个字都收不到 → 等了 30 秒 → 答案【一次性全部出现】
#
#   ★ 它不报错、不超时、接口返回 200 —— 只是「打字机效果没了」。
#     所以演示时如果看到这个现象，第一件事就是查这一段在不在。
# ============================================================

# ------------------------------------------------------------
# ★ 上游：应用容器。
#   「app」是 docker compose 里的服务名 —— 容器之间靠内置 DNS 解析，
#   所以在同一网络的 nginx 里写 app 就行，不用管 IP。
#   ★ 用 upstream 块而不是在 proxy_pass 里写死地址：
#     这样超时、长连接这些参数只有一处，两个 location 不会漂移。
# ------------------------------------------------------------
upstream xbla_app {
    server app:8080;

    # ★ 长连接。每个 SSE 请求都占一条连接，而 Nginx 默认用短连接 ——
    #   在「8 个名额 + 排队」的场景里连接数不多，这里主要是少一次握手。
    keepalive 16;
}

# ------------------------------------------------------------
# Basic Auth —— 用户选定的访问控制方式。
#
# ★ 口令文件由 compose 挂进来（deploy/.htpasswd），【不在镜像里】——
#   打进镜像等于把口令写进交付物，而且层里删不掉。
#
# ★ 加在 server 级 = 下面所有 location 都受保护。
#   单独给某个 location 加会漏：那种「有一个口子忘了加」的形态，
#   症状是那个路径可以被任何人访问，而其他路径看起来都是拦住的。
# ------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # cpolar 过来的请求，Host 是它给的那个域名。★ 不要写死 server_name,
    # 因为免费版地址每次重启都会变。
    client_max_body_size 20m;

    # 访问日志走 stdout → 由 docker 收集（compose 里配了 json-file 限大小）。
    # ★ 落盘的事交给 docker，容器内不再写一份 —— 两份日志会各自滚各自，
    #   对不上时间线。
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    charset utf-8;

    auth_basic           "XBLA 演示站";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    # --------------------------------------------------------
    # ★★★ SSE —— 本文件的重点
    #
    # 用 `location =` 精确匹配而不是前缀匹配：
    # /api/chat/stream 是个完整路径，不会有子路径。
    # 精确匹配的优先级最高，不会被别的 location 抢走 ——
    # 而被抢走的症状正是「缓冲没关掉」。
    # --------------------------------------------------------
    location = /api/chat/stream {
        proxy_pass http://xbla_app;
        proxy_http_version 1.1;

        # ★★★ 这一行是整个文件里最重要的一行。
        #   去掉它 → 打字机效果消失 → 答案等 30 秒一次性出现。
        proxy_buffering off;
        proxy_cache off;

        # ★ 不要把上游的响应压缩后再缓冲 —— 压缩需要攒够一块才能压，
        #   那等于把刚关掉的 buffering 又开回来了。
        gzip off;

        # ★★ 超时必须够长。默认 60 秒会在【最需要排队提示的时候】把连接掐断。
        #
        #   应用侧那条连接的最长寿命是「排队预算 + 回答预算」：
        #       120s（排队上限）+ 180s（回答预算）= 300s
        #   见 ChatController.sseTimeoutMs()。
        #
        #   ★ 这里给 360s、比 300s 多一分钟：让【应用】先在 300s 超时
        #     并推一个失败事件（前端能显示一句人话），
        #     而不是让 Nginx 先掐断（前端只知道连接断了，没有任何解释）。
        #     两个超时谁先触发，决定了用户看到的是「解释」还是「空白」。
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        # ★ 不缓冲请求体：POST 的 body 很小，但设成 off 能让第一个字节
        #   立刻到上游，少一次「等 body 攒够」的往返。
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ★ Connection 要置空：设成 "" 才能让 upstream 的 keepalive 生效。
        #   写成 "upgrade" 会让每个请求都新开一条连接。
        proxy_set_header Connection        "";
    }

    # --------------------------------------------------------
    # 其余 API —— 普通反代，可以缓冲（普通 JSON 响应缓冲更快）
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://xbla_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --------------------------------------------------------
    # ★★ 评测报告 ── 白名单在【镜像构建时】就已经生效了
    #
    #   /srv/public-docs/ 里【只有】两个文件，是 Dockerfile 里
    #   【逐个 COPY】进去的（不是 COPY docs/）。
    #   docs/00-项目总览.md（简历讲稿）从来就没进过这个容器。
    #
    # ★ 为什么不做成「配置里的路径白名单」（比如两条 location = 加一条 404）：
    #   文件名是中文，要在配置里写就得依赖「nginx 拿解码前还是解码后的 URI
    #   去匹配 location」这个细节 —— 而那个行为在不同版本、不同编码形式下
    #   有过变化。写错了的症状是「报告页 404」，看起来像文件没打进去。
    #
    #   ★ 文件系统层的白名单没有这个不确定性：**目录里没有的文件，
    #     任何 URL 写法都拿不到**。而那个目录里有什么，
    #     是 Dockerfile 里逐行写着的 —— 那才是该被 review 的地方。
    # --------------------------------------------------------
    location /docs/ {
        alias /srv/public-docs/;
        # ★ 关掉目录列表。开着的话 /docs/ 会列出一个文件清单 ——
        #   而「有哪些文件」本身就不该被外人知道。
        autoindex off;
        # 报告是纯文本 markdown，交给前端渲染；这里别乱猜类型
        default_type text/markdown;
        charset utf-8;

        # ★ 报告是 `eval_report.py` 重跑就会变的文件 ——
        #   不允许中间层缓存它，否则「重跑了但页面还是旧数字」。
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --------------------------------------------------------
    # 前端静态文件
    #
    # ★ 构建产物带内容哈希（index-xxxx.js），可以长期缓存 ——
    #   哈希变了文件名就变了，所以不会拿到旧代码。
    # --------------------------------------------------------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # ★★ SPA 的命门：`try_files ... /index.html`
        #
        #   路由用的是 history 模式（见 frontend/src/router.js），
        #   所以 /report 这个路径在服务器上【并不存在】——
        #   它是前端自己解析的。直接访问或按 F5 时，
        #   Nginx 必须把 /report 也指回 index.html，由前端去渲染。
        #
        #   ★ 不配这一行的症状：**首页好好的，一刷新就 404**。
        #     那看起来像后端挂了，其实是静态资源这一段少了一行。
        try_files $uri $uri/ /index.html;

        # ★ index.html 本身不缓存：它是「该加载哪个带哈希的 js」的唯一出处，
        #   缓存住它会让新版本发布后用户仍然加载旧资源。
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
