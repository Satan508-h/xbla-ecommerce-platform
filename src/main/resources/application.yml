# ============================================================
# 主配置文件 —— 只放「不敏感」的通用配置，会提交到 git
#
# 敏感信息（API Key、数据库密码）一律放 application-local.yml，
# 那个文件已在 .gitignore 里，永远不会被提交。
# 需要时把同目录下的 application-local.yml.example 复制一份改名即可。
# ============================================================

server:
  # 后端服务端口
  port: 8080

spring:
  application:
    name: xbla-rag

  # ------------------------------------------------------------
  # 数据库连接
  #
  # 这里只放「非密钥」的部分（URL、驱动、连接池参数），
  # 用户名密码在 application-local.yml 里（已被 gitignore）。
  # Spring Boot 会把两个文件的配置合并，profile 文件优先级更高。
  # ------------------------------------------------------------
  datasource:
    # ★ URL 末尾的 stringtype=unspecified 不能省，原因如下：
    #
    #   pgjdbc 默认把 Java String 当作 varchar 类型发送给 PostgreSQL。
    #   而本项目有几个列不是 varchar：
    #     - kb_chunk.embedding    类型 vector(1024)
    #     - chat_message."references"  类型 jsonb
    #     - qa_log."references"        类型 jsonb
    #   PostgreSQL 不会把 varchar 隐式转换成这些类型，会直接报错：
    #     column "references" is of type jsonb but expression is of type character varying
    #
    #   加上 stringtype=unspecified 后，驱动把字符串以「未指定类型」发送，
    #   由 PostgreSQL 根据目标列的类型自行推断 —— 这是 pgjdbc 官方推荐的
    #   处理 jsonb / 自定义类型（如 pgvector 的 vector）的标准做法。
    url: jdbc:postgresql://localhost:5432/xbla_rag?stringtype=unspecified
    driver-class-name: org.postgresql.Driver

    # HikariCP 连接池参数（非密钥，放这里）
    hikari:
      # 最大连接数。本地开发用不了那么多，设小一点省资源
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      # 连接最长存活时间，防止数据库端主动断开后拿到死连接
      max-lifetime: 1800000
      # ★ 启动时若连不上数据库，是否让应用启动失败。
      #   -1 表示不检查 —— 数据库没起来应用也能启动，
      #   /actuator/health 会显示 db 为 DOWN。
      #   这样调试时不会因为忘了开 Docker 就整个应用起不来。
      initialization-fail-timeout: -1

  # 激活 local 配置分支。
  # Spring Boot 会自动去找 application-local.yml 并加载，
  # 同名配置项以 local 文件为准（覆盖下面的默认值）。
  # 如果该文件不存在，Spring Boot 不会报错，只是跳过。
  profiles:
    active: local

  # ------------------------------------------------------------
  # Flyway 数据库迁移
  #
  # 应用启动时自动执行 db/migration 下「还没跑过」的迁移脚本，
  # 执行记录写在数据库的 flyway_schema_history 表里。
  # ------------------------------------------------------------
  flyway:
    enabled: true
    # 迁移脚本位置（classpath 下）
    locations: classpath:db/migration

    # ★ 允许在「已有内容的数据库」上首次运行。
    #   本项目数据库里有 sql/01-init.sql 建的 vector 扩展，
    #   Flyway 会认为这个库非空而拒绝迁移，加这个开关后
    #   它会先打一个版本 0 的基线，再从 V1 开始跑。
    #   （空库不需要这个，但设了也无害）
    baseline-on-migrate: true
    baseline-version: 0

    # 校验已执行脚本的 checksum。
    # 如果改了已执行过的迁移文件，启动会直接失败并告诉你哪个文件被改过。
    # ★ 这是保护机制，不要关掉——出问题时应该新增 V6 而不是改 V1。
    validate-on-migrate: true

    # 禁止 flyway clean（会清空整个库）。双重保险，防止误操作。
    clean-disabled: true

    # 迁移脚本的编码，中文注释必须靠它才能正确执行
    encoding: UTF-8

  # 统一 JSON 序列化行为
  jackson:
    # 日期统一用 ISO-8601 格式，避免前端拿到一堆时间戳数字
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    # 反序列化时忽略 JSON 里多余的字段，防止前端多传一个字段就报错
    #
    # ★ 这一条在阶段 2 变得非常重要：
    #   deepseek-flash 是「推理模型」，响应里多一个非标准字段 reasoning_content。
    #   本项目决策是【丢弃它】，而实现方式就是靠这一行 ——
    #   DTO 里不声明这个字段，Jackson 会自动忽略，不需要写任何过滤代码。
    deserialization:
      fail-on-unknown-properties: false

  # ------------------------------------------------------------
  # Spring MVC 异步请求超时
  #
  # ★ 这一行不能省，否则流式问答会在 30 秒时被无声掐断。
  #
  #   原因：Tomcat 的异步请求超时（asyncTimeout）默认是 30 秒。
  #   SSE 流式响应走的是 Servlet 异步机制，一旦超过这个时间，
  #   Tomcat 会直接关闭连接，日志里只有一句
  #       "Async request timed out"
  #   前端表现为「答到一半突然没了」，而且没有任何异常栈，极难排查。
  #
  #   这里设 180 秒作为全局兜底；SseEmitter 构造器上还会再单独指定一次。
  #   两处都设是刻意的冗余 —— 只设一处时，很容易因为改了其中一个而失效。
  # ------------------------------------------------------------
  mvc:
    async:
      request-timeout: 180s

# ------------------------------------------------------------
# MyBatis-Plus
# ------------------------------------------------------------
mybatis-plus:
  # Mapper XML 文件位置。阶段 1 用 BaseMapper 自带的 CRUD 就够，
  # 阶段 4 写复杂的检索 SQL 时才会往这里放 XML
  mapper-locations: classpath*:/mapper/**/*.xml

  # 实体类所在包。配了之后 XML 里写 resultType 可以用短类名（Product）
  # 而不是全限定名（com.xbla.rag.entity.Product）
  type-aliases-package: com.xbla.rag.entity

  configuration:
    # ★ 数据库下划线字段 -> Java 驼峰属性 的自动映射
    #   开了这个，product_name 自动映射到 productName，不用写 @TableField 或 @Results
    map-underscore-to-camel-case: true

    # 把执行的 SQL 打到控制台。
    # 开发阶段强烈建议开着 —— 它是发现「N+1 查询」「忘了加索引导致全表扫描」
    # 这类问题最直接的手段。上线前要关掉（日志量大且可能泄露数据）。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    # 关掉启动时那个 MyBatis-Plus 的 ASCII logo，日志清爽一点
    banner: false
    db-config:
      # ★★ 主键策略必须改成 auto ★★
      #   MyBatis-Plus 默认是 ASSIGN_ID（雪花算法），会自己生成一个 19 位 ID。
      #   而我们的表用的是 BIGSERIAL 自增，必须让它交给数据库生成，
      #   否则自增序列会被架空 —— 之后手工 INSERT 不指定 id 时就会主键冲突。
      id-type: auto

      # 逻辑删除：查询时 MP 自动拼上 WHERE deleted = 0
      # 这里的 deleted 是全局默认字段名，实体类里不用再加 @TableLogic
      logic-delete-field: deleted
      logic-delete-value: 1      # 已删除
      logic-not-delete-value: 0  # 未删除

# ------------------------------------------------------------
# actuator：运维监控接口
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # 只暴露 health 和 info。★ 千万别写 "*"，那会把 /actuator/env 之类
        # 可能泄露配置的接口也暴露出去。
        #
        # 阶段 2 追加 circuitbreakers：这是验证「降级链」最直接的窗口 ——
        #   curl localhost:8080/actuator/circuitbreakers
        # 能实时看到每个熔断器是 CLOSED / OPEN / HALF_OPEN，
        # 以及失败率、慢调用率等状态机指标。验收标准 2 就靠它。
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      # always = 健康检查详情里显示每个组件（数据库、Redis、磁盘）的具体状态。
      # 阶段 0 验收标准「Spring Boot 能连通 PostgreSQL 和 Redis」就靠这个看。
      show-details: always

# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
logging:
  level:
    root: info
    # 本项目自己的包开到 debug，方便开发时看清链路；第三方包保持 info 免得刷屏
    com.xbla.rag: debug
  charset:
    # ★ Windows 上必须显式指定，否则控制台里的中文日志是乱码。
    #   原因：Windows 控制台默认代码页是 GBK(936)，而 JVM 默认按平台编码输出，
    #   UTF-8 的字节被按 GBK 解码就变成了「鏂囦欢」这样的乱码。
    #   也可以在启动前执行 chcp 65001 切到 UTF-8，但那是环境依赖，
    #   写在这里才是「跟着项目走」的解法。
    console: UTF-8

# ============================================================
# 模型供应商与对话链路（阶段 2）
#
# 【为什么分三层？】
#   ① providers = 「连接」：域名 + 密钥。换供应商不用动模型定义。
#   ② models    = 「模型」：真实模型 ID + 单价。同一个连接上可以挂多个模型。
#   ③ chatChain = 「策略」：降级顺序。改顺序、加兜底模型都只动这一处。
#
#   这样分层的直接好处：P1 和 P2 用的是【同一个硅基流动连接、同一个 Key】，
#   但模型不同（V4-Flash / Qwen3-8B）。如果连接信息和模型混在一起写，
#   密钥就要重复两份；将来给 P2 换一家供应商，也只改 models 里的一行。
#
# 【密钥在哪？】
#   本文件只写 ${环境变量:} 形式的占位。真实密钥填在 application-local.yml
#   （已 gitignore），格式：
#       xbla:
#         llm:
#           providers:
#             deepseek:    { api-key: sk-xxx }
#             siliconflow: { api-key: sk-xxx }
#
# ⚠️ CLAUDE.md 第 5 条：API Key 绝不写进代码、绝不提交到 git。
# ============================================================
xbla:
  llm:

    # ----------------------------------------------------------
    # ① 连接层：域名 + 密钥
    #
    # ★ 两家的 base-url 都【不带 /v1】。
    #   代码里会统一拼成 {base-url}/v1/chat/completions。
    #   把版本号放在代码里而不是配置里，是为了让「配错域名」和
    #   「配错协议版本」这两类问题能在日志里一眼分开。
    # ----------------------------------------------------------
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        # 流式请求是否带 stream_options.include_usage
        # ★ 已实测（2026-09-18）：DeepSeek 官方支持，能拿到 usage
        stream-include-usage: true

      siliconflow:
        base-url: https://api.siliconflow.cn
        api-key: ${SILICONFLOW_API_KEY:}
        # ★ 已实测（2026-09-18）：硅基流动也支持。
        #   注意它返回的 usage chunk 里 choices 是【空数组】，
        #   解析时必须先判空，否则 ArrayIndexOutOfBounds。
        stream-include-usage: true

    # ----------------------------------------------------------
    # ② 模型层：真实模型 ID + 单价
    #
    # ★ 所有 model-id 都是 2026-09-18 经 GET /v1/models + 真实调用核实过的，
    #   不是凭记忆写的。CLAUDE.md 明确要求每次动工前重新核实。
    #
    # 【单价口径】元 / 百万 token，三档：
    #   input            缓存【未命中】的输入
    #   cache-hit-input  缓存【命中】的输入（便宜很多，因为省了计算）
    #   output           输出（★ 已包含推理 token，不要重复计）
    #
    # ⚠️ DeepSeek 官方采用【峰谷分时计价】（周一至周五 9:00-12:00、14:00-18:00
    #    为高峰，价格翻倍）。本项目按【空闲时段】单价计算，属于已知简化 ——
    #    在高峰时段跑批会把成本低估约一半。详见 docs/08-技术决策记录(ADR).md。
    #
    # ⚠️ 价格数据源之间存在矛盾（DeepSeek 输出价：官方文档页标 2 元，
    #    而 2026-09-10 的降价公告写 4 元）。这里取降价公告口径。
    #    **请以你自己账号的账单页为准**，首次真实调用后核对 qa_log.cost 是否吻合。
    # ----------------------------------------------------------
    models:

      # P0 —— DeepSeek 官方主力
      # ★ 它是「推理模型」：响应含非标准字段 reasoning_content，
      #   实测推理 token 占总输出的 87%。因此 max-tokens 必须给足，
      #   给太小会导致推理把额度吃光、content 返回空字符串。
      deepseek-flash:
        provider: deepseek
        model-id: deepseek-flash
        pricing:
          input: 1.0              # 缓存未命中
          cache-hit-input: 0.02   # 缓存命中
          output: 4.0

      # P1 —— 硅基流动上的 DeepSeek-V3.2
      #
      # ★ 实测（2026-09-18）：它【不是】推理模型（reasoning 长度为 0），
      #   问「用一个词回答」只用了 9 输入 / 1 输出 token、1.45 秒 ——
      #   比推理模型快一个数量级，也更便宜。
      #
      # ⚠️ 设计影响：它和 P0 的 deepseek-flash 不是同一个模型，
      #    所以 P0→P1 这一步从「同模型换源（质量不变）」变成了
      #    「真正的模型切换」。docs/02 里原先的设计描述已同步修正。
      deepseek-v3-2:
        provider: siliconflow
        model-id: deepseek-ai/DeepSeek-V3.2
        pricing:
          input: 2.0
          # 硅基流动未公布这两个模型的独立缓存价，按与 input 同价填 ——
          # 保守（可能高估成本），但绝不会低估。若账单显示有缓存折扣再调。
          cache-hit-input: 2.0
          output: 3.0

      # P2 —— 兜底模型
      #
      # ★ 实测（2026-09-18）：它【是】推理模型，但比之前的 Qwen3-8B 好得多 ——
      #   同一个问题：Qwen3-8B 推理 672 token / 耗时 111 秒，
      #   Qwen3.5-9B 推理 379 token / 耗时 10.8 秒。
      #
      # 价格按国内站 ≤128k 上下文档填写（本项目上下文远小于 128k）。
      qwen3-5-9b:
        provider: siliconflow
        model-id: Qwen/Qwen3.5-9B
        pricing:
          input: 0.5
          cache-hit-input: 0.5
          output: 4.0

    # ----------------------------------------------------------
    # ③ 策略层：降级顺序（P0 → P1 → P2）
    #
    # 每个条目对应一个独立的熔断器（名字 = 这里的 key）。
    # ★ 粒度是「每个模型一个」而不是「每个供应商一个」：
    #   硅基流动上 P1 被限流(429)时，P2 可能还是健康的，
    #   按供应商做熔断会把健康的 P2 一起拖下水。
    #
    # ⚠️ 注意 key 的命名限制：Spring Boot 对 Map 的 key 只允许
    #    【小写字母 + 数字 + 短横线】。所以模型版本里的点要写成短横线 ——
    #    deepseek-v3.2 要写成 deepseek-v3-2，否则必须用 [key] 括号语法。
    # ----------------------------------------------------------
    chat-chain:
      - deepseek-flash
      - deepseek-v3-2
      - qwen3-5-9b

    # ----------------------------------------------------------
    # 全局默认参数
    # ----------------------------------------------------------
    defaults:
      # ★★ 这个值不能改小！★★
      #   deepseek-flash 是推理模型，实测 124 个输出 token 里 108 个是推理。
      #   max-tokens 给 20 时，推理把额度吃光，content 返回【空字符串】——
      #   现象是「AI 不说话」，日志里却没有任何异常。这是本项目最难排查的坑之一。
      max-tokens: 2048

      # 不设 temperature 时请求体里不带这个字段，用服务端默认值。
      # 显式写成 null 而不是删掉，是为了让「可配置但默认不启用」这件事在配置里可见。
      temperature: null

      # 连接层超时：只管 TCP 建连（目标挂了 / DNS 解析不出来）
      connect-timeout: 5s

      # 请求层超时：从发出到【收到响应头】（TTFB）。
      # ★ 对流式请求（BodyHandlers.ofLines），这个超时只覆盖到响应头，
      #   之后边读边推的过程它不管 —— 所以还需要 SseEmitter 那层超时兜底，
      #   见 spring.mvc.async.request-timeout。
      request-timeout: 15s

      # ★ 非流式请求（BodyHandlers.ofString）的完整响应超时。
      #
      #   为什么必须和上面分开？因为两者的语义完全不同：
      #     ofLines  → 超时只到「响应头到达」为止，之后是流式读取
      #     ofString → 超时要覆盖【整个响应体接收完毕】
      #
      #   如果非流式也用 15 秒，那么生成一篇长回答（几千 token）必然超时。
      #   实测推理模型 124 个输出 token 里 108 个是推理，
      #   2048 的 max-tokens 在慢的时候要跑一分多钟。
      #
      #   180 秒是按「2048 输出 token ÷ 约 20 token/秒 ≈ 100 秒」留的余量。
      complete-timeout: 180s

      # 单次流式响应允许的最长持续时间，防止超长回答一直占着连接
      max-stream-duration: 5m

      # --------------------------------------------------------
      # 熔断器参数
      #
      # ★ 关键设计：熔断器观测的「耗时」用的是 TTFB（建连 + 首字延迟），
      #   【不是】整个流的持续时间。
      #
      #   为什么？一次 60 秒的正常长回答，如果按整个流耗时喂给熔断器，
      #   会触发下面的 slow-call-rate-threshold，导致熔断器在
      #   「系统最健康、正在正常干重活」的时候跳闸 —— 这是最坏的反向优化。
      #
      #   所以 slow-call-duration-threshold 设 15 秒：
      #   正常情况下 TTFB 只有 1-3 秒，15 秒确实说明这家有问题。
      # --------------------------------------------------------
      circuit-breaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10          # 统计最近 10 次调用
        minimum-number-of-calls: 5       # 攒够 5 次才开始判定（样本太少不算数）
        failure-rate-threshold: 50       # 失败率 > 50% 就跳闸
        slow-call-duration-threshold: 15s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s # 跳闸后 30 秒进入「半开」试探
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

    # ----------------------------------------------------------
    # 向量化与重排序
    #
    # ★ 只有硅基流动提供这两项能力，DeepSeek 官方没有。
    #   这是本项目采用双供应商架构的根本原因。
    # ----------------------------------------------------------
    embedding:
      provider: siliconflow
      model-id: BAAI/bge-m3
      # ★ 1024 维已实测确认，与 kb_chunk.embedding 的 vector(1024) 建表一致。
      #   改这个值必须同时改表结构（全项目向量维度基准，见 CLAUDE.md 第 8 条）。
      dimension: 1024

    rerank:
      provider: siliconflow
      model-id: BAAI/bge-reranker-v2-m3

  # ============================================================
  # 知识库：文档入库（阶段 3）
  #
  # 这些参数里，切分那几项是【阶段 7 做 A/B 调优的主要抓手】。
  # 切片太长会引入无关噪声，太短会丢上下文 —— 用真实指标说话，
  # 所以它们全放在配置里，改一行 YAML 重启即可，不用改代码重新打包。
  # ============================================================
  kb:
    # 上传文件落盘目录。已在 .gitignore 里，不会进 git
    storage-dir: data/uploads
    # 仿真语料目录（scripts/generate_corpus.py 的输出位置）
    corpus-dir: data/corpus

    chunking:
      # 单个切片目标最大字符数。中文 1 字约 0.7~1 token，500 字约 400 token。
      # ⚠️ 这是初始假设，不是标准答案，阶段 7 要用指标验证
      max-chars: 500
      # 相邻切片的重叠窗口。答案横跨切分点时靠它救回来
      overlap-chars: 80
      # 低于这个长度尝试并入同一章节的上一篇（避免噪声切片）
      min-chars: 80
      # 整个章节短于这个值时不再切分，整段作为一片（避免切出小尾巴）
      merge-threshold-chars: 700
      # 优先断在这些标点之后，尽量不把句子拦腰截断
      break-chars: "。！？；!?;\n"
      # 把标题路径拼进切片正文最前面。
      # ★ 默认开：用户问「退货政策是什么」时，「退货」二字可能只出现在标题里，
      #   正文写的是「签收后 7 天内可申请」。标题不参与向量化就丢了关键语义线索。
      include-heading-in-content: true

    embedding:
      # 单次提交向量化的条数。和 OpenAiCompatibleEmbeddingClient 内部的分批大小对齐
      batch-size: 32
      # 单条文本送入接口前的字符上限（兜底，正常切分不会触发）
      max-chars-per-text: 4000

    ingest:
      # ★ 线程数故意开得很少：瓶颈在对方的限流阈值，不在我们的 CPU。
      #   开太多只会更快撞上 429，然后整批一起失败
      core-pool-size: 2
      max-pool-size: 4
      # 队列故意设得很大：入库是后台任务，排队对用户不可见。
      # 和 sseExecutor 的「队列故意设小」正好相反，理由见 AsyncConfig 的注释
      queue-capacity: 200

  # ============================================================
  # 检索链路（阶段 4）
  #
  # ★ 这一整段都是【阶段 7 要做 A/B 对比的旋钮】——
  #   全部外置成配置，是为了让「同一份代码、只改配置」就能跑对比实验，
  #   而且这些值会被快照进评测报告，能回答「这次和上次差在哪个参数」。
  #
  # ⚠️ 下面的默认值全是【初始假设，不是调优结果】。
  #    别把它们当成经过验证的最优值 —— 真正的结论要等指标出来。
  # ============================================================
  rag:

    retrieve:
      # 两路各自召回多少条。要明显大于最终送进 prompt 的条数，
      # 给融合和重排留出筛选空间；但也不能太大，重排成本与候选数成正比
      vector-top-k: 20
      keyword-top-k: 20
      # 最终送进 prompt 的切片数。越多上下文越全，但无关内容的干扰和输入 token 也越多
      final-top-k: 5
      # 查询分词后的词元上限，用于限制 OR 查询链的长度。
      # ★ 只作用于【查询】，不作用于文档 —— 500 字的切片有约 499 个 bigram，
      #   按这个数截断会直接毁掉索引。两者需求相反，所以在分词器里就是两个方法
      max-query-tokens: 64

    fuse:
      # RRF 公式 score = Σ weight/(k + rank) 里的常数 k。
      # 60 是原论文（Cormack 2009）的推荐值。k 越大名次差异越被削弱，
      # 于是「在某一路排第 1」不至于压倒「在两路都排第 5」——
      # RRF 奖励的是【被多路共同认可】，不是单路的极端高分
      k: 60
      # 两路权重。默认等权；阶段 7 若发现某一路明显更弱，靠权重压下去即可，不必删掉那条路
      vector-weight: 1.0
      keyword-weight: 1.0

    rerank:
      # ★ 重排是检索质量的最大单点提升来源，而且失败时会自动回落成 RRF 顺序
      enabled: true
      # 重排要对每个 (问题, 候选) 对做一次完整模型前向计算，候选数直接决定延迟和成本
      max-candidates: 50
      # 留空则用 retrieve.final-top-k
      top-n:

    rewrite:
      # ★★★ 默认【关闭】（2026-09-19 用户拍板）
      #
      # 不是为了省事，是为了让基线干净：默认开启的话，阶段 4 记录下来的基线
      # 就带着改写，阶段 7 的 A/B 无法回答「提升来自改写还是来自别的优化」。
      #
      # 关闭时 qa_log.rewritten_question 写 null（不是写原文）——
      # 否则阶段 7 分不清「没开重写」和「重写后跟原文一样」，那是两个不同的实验条件
      enabled: false

  # ============================================================
  # 会话（阶段 5.5 / 5.6）
  #
  # ★ 为什么新开一个前缀，而不是塞进 xbla.agent：
  #   agent 那一组围绕「这句话属于哪一类」，而会话记忆回答的是
  #   「这句话是在什么背景下说的」—— 没有哪个参数同时影响两者。
  #
  # 两块的分工：
  #   history —— 最近 N 轮的【原文】，无损，覆盖细节
  #   summary —— 更早对话的【压缩】，有损，保证不断
  #   两者是同一条时间轴上相邻的两段，接缝由 SessionSummarizer 推进的游标保证。
  # ============================================================
  chat:

    # 滑动窗口会话记忆（5.5）
    history:

      # 总开关。默认开，但留这个开关是为了阶段 7 的 A/B：
      # 「带上历史对最终答案质量到底有没有提升」只有拿开/关两组同样的题跑一遍才能回答。
      #
      # ⚠️ 关掉时什么都不读 —— 不是「读了不拼」。
      #    否则阶段 7 分不清「没开记忆」和「开了但历史是空的」。
      enabled: true

      # 窗口大小，单位【轮】（一问一答算一轮）。
      #
      # ★ 为什么按轮数而不是按 token 数：实测本项目真实数据
      #     用户消息 平均 9 字（最长 25） / 助手消息 平均 105 字（最长 352）
      #   10 轮 ≈ 1200 字，而 max-tokens 是 2048 —— 这个规模下 token 上限
      #   根本碰不到。为碰不到的上限引入一个【不准】的 token 估算器不划算：
      #   估出来的值一旦被当阈值用，它咬人的方式是「历史偶尔少一轮」这种查不出来的现象。
      #
      # ★ 5.6 上了摘要压缩之后【仍然】没有引入 token 估算器 ——
      #   走到最后还是「按轮数滑窗 + 摘要兜远处」。摘要有它自己的长度预算
      #   （见下面的 summary.max-chars），和窗口的轮数预算是两件事。
      #
      # ★ 为什么是 10：阶段 5 验收标准第 3 条是「连续 10 轮对话后，
      #   早期提到的商品偏好仍被记住」—— 窗口取 10 让那条标准字面对应一个
      #   可解释的数，而不是「大概够吧」。
      #
      # ⚠️ 它是初始假设，不是调优结果。真正的结论要等阶段 7 的
      #    「多轮追问」题集出来才作数。
      max-turns: 10

    # 摘要压缩（5.6）—— 把【掉出窗口】的对话压成一段话接着用
    #
    #   送给模型的上下文 = 【摘要（更早的对话）】 + 【最近 N 轮原文】
    #                       └─ 有损，但不会断 ─┘   └─ 无损，覆盖最近的细节 ─┘
    #
    # ★ 它是 V5 建 chat_summary 表时写的「双层记忆策略」的落地。
    #   只留摘要会丢细节，只留原文会撑爆 token，两层是精度和成本的折中。
    summary:

      # 总开关。同 history.enabled：留它是为了阶段 7 的 A/B。
      # ⚠️ 关掉时不生成也不读。
      enabled: true

      # ★★ 掉出窗口的消息攒到这么多条，才生成一次摘要。
      #
      # 【为什么默认是 2（= 溢出就压）】
      #   因为它直接决定「摘要层有没有用」。设成一个窗口那么大（20）看起来很省：
      #     第 11 轮   → 第 1 轮掉出窗口，摘要还没生成
      #     第 11-20 轮 → 第 1 轮彻底看不见
      #     第 20 轮   → 终于攒够，压出摘要，第 1 轮回来了
      #   而本项目真实会话【最长就 10 轮】—— 大阈值下摘要层几乎永远不生效，
      #   会变成一个跑通了但没用的功能。
      #
      # 【代价】从第 11 轮起每轮多一次 LLM 调用（后台异步，用户不等）。
      #   但那段区间只有长会话才到得了，而长会话恰恰是唯一需要摘要的场景。
      #
      # ⚠️ 调大它不会让摘要变差，只会让「摘要覆盖到哪」落后更多 ——
      #    表现是「明明聊了 30 轮，模型还是想不起第 1 轮说的预算」。
      trigger-messages: 2

      # 摘要正文的目标长度（字），写进 prompt 当指令。
      # ⚠️ 不是硬上限 —— 硬上限是它的 2 倍，超了会截断 + 打 WARN。
      #    因为「摘要长到失控」比「摘要被截掉一点」更危险：
      #    它每一轮都要进 prompt，是一笔慢性的 token 开销。
      max-chars: 800

      # 生成摘要请求的 max_tokens。留空 = 用 xbla.llm.defaults.max-tokens（2048）。
      #
      # ★★ 绝不能给小！同 xbla.agent.intent.max-tokens 那个坑：
      #    降级链的 P0 是 deepseek-flash【推理模型】，实测推理 token 占输出 87%。
      #    给小的后果是推理把额度吃光、content 返回【空字符串】，
      #    表现为「摘要永远生成失败」而日志里没有任何异常。
      #    摘要比分类更要注意：分类只输出几个 token，摘要要输出几百字。
      max-tokens:

      # 生成摘要请求的 temperature。摘要是「压缩已有文本」，不是创作。
      # ⚠️ 但 0.0 不等于确定性（见 xbla.agent.intent.temperature 的实测）——
      #    同一段对话压两次会有措辞差异，这是正常的。
      temperature: 0.0

  # ============================================================
  # MCP（阶段 5.7）
  #
  # ★ 服务端是手写的 Streamable HTTP，端点在 POST /mcp。
  #   协议版本、错误语义、会话这些都写在代码里（不是配置）——
  #   它们是协议的一部分，做成配置只会让人配出一份不合规的服务端。
  #   这里只放「和部署环境有关」的那一项。
  # ============================================================
  mcp:

    # Origin 白名单，逗号分隔。
    #
    # ★★ 规范【强制】要求校验 Origin —— 防 DNS rebinding：
    #    一个恶意网页能让用户的浏览器去 POST localhost:8080/mcp，
    #    而浏览器的同源策略拦不住跨源 POST。
    #
    # ⚠️ 头【不存在】时放行，这是刻意的：非浏览器客户端（官方 SDK、curl）
    #    本来就不发 Origin，而 rebinding 必须由浏览器发起。
    #    「缺席就拒」只会挡住合法客户端，攻击者一点不受影响。
    #
    # ⚠️ 换前端端口 / 加域名时记得改这里，否则浏览器发起的请求会被 403。
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080

  # ============================================================
  # 智能体层（阶段 5）
  #
  # ★ 意图路由相关：意图树的路径、分类的模型档位与少样本文件。
  #   会话记忆（5.5）在 xbla.chat 下，不在这里。
  # ============================================================
  agent:

    # 分层意图树的定义文件（相对应用启动目录，即项目根目录）
    #
    # ★ 放 data/ 而不是 src/main/resources/，和 manifest.yml、
    #   baseline-questions.yml 一致：都是人手工维护、程序读取的声明式数据。
    #   好处是改了不用重新编译 —— 加载器按文件的修改时间做热加载。
    #
    # ⚠️ 与语料清单刻意相反的一点：这个文件【找不到就直接崩】。
    #    清单缺少时打 WARN 回落（老路径 ?docType= 还在，有真兜底），
    #    而意图树没有合理的兜底值 —— 回落只能等于把所有问题判成同一类。
    intent-tree-path: data/agent/intent-tree.yml

    # 意图识别（阶段 5.2）
    intent:

      # 分类用的少样本示例
      #
      # ★ 和 intent-tree.yml 里的 examples 字段是【两件事】，不能合并：
      #   树里的示例是【给人看的文档】（可以用最典型的问法，哪怕那句话
      #   同时是评测题）；这份是【给模型看的 prompt 素材】（一句都不能是评测题）。
      #   实测两者的交集是 18/20 —— 合并会让 5.2 的准确率虚高。
      few-shot-path: data/agent/intent-fewshot.yml

      # 分类请求的 max_tokens。★★ 这个值不能给小！
      #
      #   直觉上分类只输出一个叶子码，给 16 就够。但降级链的 P0 是
      #   deepseek-flash ——【推理模型】，实测 124 个输出 token 里 108 个是推理。
      #   给小的后果是推理把额度吃光、content 返回【空字符串】，
      #   表现为「分类永远失败」而日志里没有任何异常。
      #   这是 CLAUDE.md 里记着的那个坑（阶段 2 踩过，现象是「AI 不说话」）。
      #
      #   留空 = 用 xbla.llm.defaults.max-tokens（2048）。
      #   ⚠️ 真要调小，先读 LlmIntentClassifier 的类注释第二节。
      max-tokens:

      # 分类请求的 temperature。
      #
      # ⚠️ 【2026-09-19 实测更正】这里原先的注释写的是「分类是确定性任务，
      #    温度调高会让结果测不准」—— 那句话是错的，至少是不完整的：
      #
      #      「退货要几天」跑 8 次（全部走 deepseek-flash，modelKey 全程一致）：
      #        RETURN_EXCHANGE ×7
      #        REFUND          ×1      ← 翻转了
      #
      #    temperature=0.0 【并不能保证确定性】。成因是推理模型的固有性质
      #    （GPU 浮点并行归约 + batching），和阶段 4 记下的
      #    「向量化接口有约 3e-4 漂移」是同一类现象。
      #    而分类的输出只有几个 token —— 几个 token 的差异就直接是另一个答案。
      #
      # 【后果】单次测量的准确率有约 ±5% 的逐题波动（n=20 时一道题就是 5%）。
      #    要报准确率就必须重复多次，见 docs/06。
      #
      # 【为什么还是设 0.0】我们不主动往方差里再加东西。它压不掉固有的那一份，
      #    但也不该由我们来放大。真要压只能多次采样取多数 —— 而那是 5.3 的设计
      #    决定（那 3 次的一致度正好可以当置信度用），不在这里拍板。
      temperature: 0.0

    # ----------------------------------------------------------
    # ④ 工具调用（阶段 5.8）
    #
    # ★ 和上面 xbla.mcp.client 的分工：
    #   这里管【怎么用工具】（业务策略），那边管【怎么连工具】（连接参数）。
    #   混在一起的话，换一个 MCP Server 地址就要把轮次上限一起搬。
    # ----------------------------------------------------------
    tool:

      # 最多允许【几轮可以调工具】的往返。
      #
      # ★ 它不是模型调用总次数 —— 超过之后还有【最后一轮】，
      #   那一轮会撤掉工具，强制模型用手上的信息作答。
      #   所以总模型调用次数 ≤ max-tool-rounds + 1。
      #
      # 默认 3：1 轮覆盖绝大多数问题；2 轮覆盖「先查订单、看到商品、
      #   再查库存」这种链式追问；3 轮是余量。
      #
      # ⚠️ 设成 0 = 永远不调工具（但工具类意图仍然会走这条路，
      #   模型会拿到「实时查询不可用」的说明）。
      #   这是个给阶段 7 做 A/B 用的开关，不是日常配置项。
      max-tool-rounds: 3

      # 工具往返的 temperature。
      #
      # ★ 默认 0.0，和意图分类同一个理由：
      #   「调不调工具、调哪个」是个【判断】，不是创作。
      #   这里要的是稳定复现，不是多样性。
      #
      # ⚠️ 但 0.0 不等于确定性 —— 见上面 intent.temperature 的实测记录。
      temperature: 0.0

      # 工具列表拉不到时，塞进 system prompt 的那段说明。
      #
      # ★★ 它存在的理由是 ADR-044：
      #   工具意图退化成裸聊时，模型会【凭空编一个订单状态出来】。
      #   没有这段话，模型面对「用户问订单、我手上什么都没有」的局面，
      #   最自然的反应就是「根据一般情况，您的订单预计 3-5 天送达」——
      #   一句听起来完全合理的假话。
      #
      # ⚠️ 措辞的关键是【给出「不知道」这个选项】，而不是只下禁令。
      #   只说「不要编造」时，模型会退而说「系统繁忙，请稍后再试」，
      #   那是另一种不准确。
      unavailable-note: |
        【系统提示】实时查询服务当前不可用。
        如果用户在问他自己那笔订单、商品的实时库存、或者他账户里的优惠券，请如实告诉用户你现在查不到这些实时数据，并建议他稍后再试。
        ★ 绝对不要根据通用的售后规则去推测某笔具体订单的状态、到货时间或物流信息 —— 那些数据只有实时查询才能拿到。

      # 工具类意图但【没有身份】（请求头里没有 X-Xbla-User-Id）时的回复。
      #
      # ★ 这条【不调模型】。理由：用户没带身份头时我们确实查不出「他的」订单，
      #   让模型发挥的唯一素材就是通用售后规则 —— 也就是编。
      #   这和 5.3 澄清路径「短路不调模型」是同一个设计。
      #
      # ⚠️ 它不是 401。只有工具这一条路需要身份，知识库问答不需要 ——
      #   对后者回 401 会把整个服务变成需要登录的，
      #   而演示页和现有的每一个 curl 命令都没有带头。
      no-identity-text: |
        我需要先知道你是哪位，才能查你的订单、库存或优惠券。
        请在请求头里带上 X-Xbla-User-Id（本项目还没有登录体系，这一个头就是全部的身份来源）。

  # ============================================================
  # MCP Client（阶段 5.8）
  #
  # ★ 和服务端的 xbla.mcp 是两回事，所以放在【同一个前缀下面并列】：
  #   xbla.mcp             —— 服务端（我们对外提供工具，5.7）
  #   xbla.mcp.client      —— 客户端（我们连别人的工具，5.8）
  #
  # ⚠️ 协议版本、JSON-RPC 错误码、方法名这些【不放配置】——
  #   它们是协议的一部分，做成配置只会让人配出一份不合规的客户端，
  #   然后拿「我明明是这么配的」来解释一个协议错误。
  # ============================================================
  mcp.client:

    # 要不要接 MCP 工具。
    #
    # ★ 关掉时，工具类意图会拿到一句「实时查询不可用」的诚实说明，
    #   而不是静默退化成知识库检索 —— 后者会让模型拿通用规则
    #   编一个订单状态出来（ADR-044）。
    enabled: true

    # MCP Server 的根地址（不带路径，路径由 endpoint 给）。
    #
    # ★ 默认指向自己 —— 这个项目里 Server 和 Client 在同一个 JVM 里，
    #   见 McpController 类注释第一节的说明。
    #   换成别的地址就是一个真正的外部 MCP Server，工具代码一行都不用改，
    #   这是走协议而不是直接调用的收益。
    #
    # ⚠️ 端口要和 server.port 一致。改了一个忘了另一个的症状是
    #   「所有工具都查不到」，而日志里是一行「连接被拒绝」。
    base-url: http://localhost:8080
    endpoint: /mcp

    # ★ 连接超时和请求超时是【两件事】：
    #   一个管「连不上」，一个管「连上了但不回话」。
    #   只配后者的话，地址写错时会卡到请求超时才报错。
    connect-timeout: 3s
    request-timeout: 3s
    initialization-timeout: 5s

    # 客户端自报的名字，会出现在服务端的日志和 initialize 响应里。
    # ★ 它是「哪个客户端连了我」唯一的线索 —— MCP Server 可能同时被
    #   Claude Desktop、调试脚本、本项目的 Client 连着。
    client-name: xbla-rag
    client-version: 0.1.0
