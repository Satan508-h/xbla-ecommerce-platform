# ============================================================
# 主配置文件 —— 只放「不敏感」的通用配置，会提交到 git
#
# 敏感信息（API Key、数据库密码）一律放 application-local.yml，
# 那个文件已在 .gitignore 里，永远不会被提交。
# 需要时把同目录下的 application-local.yml.example 复制一份改名即可。
# ============================================================

server:
  # 后端服务端口
  port: 8080

spring:
  application:
    name: xbla-rag

  # ------------------------------------------------------------
  # 数据库连接
  #
  # 这里只放「非密钥」的部分（URL、驱动、连接池参数），
  # 用户名密码在 application-local.yml 里（已被 gitignore）。
  # Spring Boot 会把两个文件的配置合并，profile 文件优先级更高。
  # ------------------------------------------------------------
  datasource:
    # ★ URL 末尾的 stringtype=unspecified 不能省，原因如下：
    #
    #   pgjdbc 默认把 Java String 当作 varchar 类型发送给 PostgreSQL。
    #   而本项目有几个列不是 varchar：
    #     - kb_chunk.embedding    类型 vector(1024)
    #     - chat_message."references"  类型 jsonb
    #     - qa_log."references"        类型 jsonb
    #   PostgreSQL 不会把 varchar 隐式转换成这些类型，会直接报错：
    #     column "references" is of type jsonb but expression is of type character varying
    #
    #   加上 stringtype=unspecified 后，驱动把字符串以「未指定类型」发送，
    #   由 PostgreSQL 根据目标列的类型自行推断 —— 这是 pgjdbc 官方推荐的
    #   处理 jsonb / 自定义类型（如 pgvector 的 vector）的标准做法。
    url: jdbc:postgresql://localhost:5432/xbla_rag?stringtype=unspecified
    driver-class-name: org.postgresql.Driver

    # HikariCP 连接池参数（非密钥，放这里）
    hikari:
      # 最大连接数。本地开发用不了那么多，设小一点省资源
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      # 连接最长存活时间，防止数据库端主动断开后拿到死连接
      max-lifetime: 1800000
      # ★ 启动时若连不上数据库，是否让应用启动失败。
      #   -1 表示不检查 —— 数据库没起来应用也能启动，
      #   /actuator/health 会显示 db 为 DOWN。
      #   这样调试时不会因为忘了开 Docker 就整个应用起不来。
      initialization-fail-timeout: -1

  # 激活 local 配置分支。
  # Spring Boot 会自动去找 application-local.yml 并加载，
  # 同名配置项以 local 文件为准（覆盖下面的默认值）。
  # 如果该文件不存在，Spring Boot 不会报错，只是跳过。
  profiles:
    active: local

  # ------------------------------------------------------------
  # Flyway 数据库迁移
  #
  # 应用启动时自动执行 db/migration 下「还没跑过」的迁移脚本，
  # 执行记录写在数据库的 flyway_schema_history 表里。
  # ------------------------------------------------------------
  flyway:
    enabled: true
    # 迁移脚本位置（classpath 下）
    locations: classpath:db/migration

    # ★ 允许在「已有内容的数据库」上首次运行。
    #   本项目数据库里有 sql/01-init.sql 建的 vector 扩展，
    #   Flyway 会认为这个库非空而拒绝迁移，加这个开关后
    #   它会先打一个版本 0 的基线，再从 V1 开始跑。
    #   （空库不需要这个，但设了也无害）
    baseline-on-migrate: true
    baseline-version: 0

    # 校验已执行脚本的 checksum。
    # 如果改了已执行过的迁移文件，启动会直接失败并告诉你哪个文件被改过。
    # ★ 这是保护机制，不要关掉——出问题时应该新增 V6 而不是改 V1。
    validate-on-migrate: true

    # 禁止 flyway clean（会清空整个库）。双重保险，防止误操作。
    clean-disabled: true

    # 迁移脚本的编码，中文注释必须靠它才能正确执行
    encoding: UTF-8

  # 统一 JSON 序列化行为
  jackson:
    # 日期统一用 ISO-8601 格式，避免前端拿到一堆时间戳数字
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    # 反序列化时忽略 JSON 里多余的字段，防止前端多传一个字段就报错
    deserialization:
      fail-on-unknown-properties: false

# ------------------------------------------------------------
# MyBatis-Plus
# ------------------------------------------------------------
mybatis-plus:
  # Mapper XML 文件位置。阶段 1 用 BaseMapper 自带的 CRUD 就够，
  # 阶段 4 写复杂的检索 SQL 时才会往这里放 XML
  mapper-locations: classpath*:/mapper/**/*.xml

  # 实体类所在包。配了之后 XML 里写 resultType 可以用短类名（Product）
  # 而不是全限定名（com.xbla.rag.entity.Product）
  type-aliases-package: com.xbla.rag.entity

  configuration:
    # ★ 数据库下划线字段 -> Java 驼峰属性 的自动映射
    #   开了这个，product_name 自动映射到 productName，不用写 @TableField 或 @Results
    map-underscore-to-camel-case: true

    # 把执行的 SQL 打到控制台。
    # 开发阶段强烈建议开着 —— 它是发现「N+1 查询」「忘了加索引导致全表扫描」
    # 这类问题最直接的手段。上线前要关掉（日志量大且可能泄露数据）。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    # 关掉启动时那个 MyBatis-Plus 的 ASCII logo，日志清爽一点
    banner: false
    db-config:
      # ★★ 主键策略必须改成 auto ★★
      #   MyBatis-Plus 默认是 ASSIGN_ID（雪花算法），会自己生成一个 19 位 ID。
      #   而我们的表用的是 BIGSERIAL 自增，必须让它交给数据库生成，
      #   否则自增序列会被架空 —— 之后手工 INSERT 不指定 id 时就会主键冲突。
      id-type: auto

      # 逻辑删除：查询时 MP 自动拼上 WHERE deleted = 0
      # 这里的 deleted 是全局默认字段名，实体类里不用再加 @TableLogic
      logic-delete-field: deleted
      logic-delete-value: 1      # 已删除
      logic-not-delete-value: 0  # 未删除

# ------------------------------------------------------------
# actuator：运维监控接口
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # 只暴露 health 和 info。★ 千万别写 "*"，那会把 /actuator/env 之类
        # 可能泄露配置的接口也暴露出去。
        include: health,info
  endpoint:
    health:
      # always = 健康检查详情里显示每个组件（数据库、Redis、磁盘）的具体状态。
      # 阶段 0 验收标准「Spring Boot 能连通 PostgreSQL 和 Redis」就靠这个看。
      show-details: always

# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
logging:
  level:
    root: info
    # 本项目自己的包开到 debug，方便开发时看清链路；第三方包保持 info 免得刷屏
    com.xbla.rag: debug
