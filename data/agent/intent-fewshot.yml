# ============================================================
# 意图分类的少样本示例（few-shot）—— 阶段 5.2
#
# 这份文件是给【模型】看的，塞进分类 prompt。
# 它和 `intent-tree.yml` 里的 `examples` 字段是【两件事】：
#
#   intent-tree.yml > examples   给人看的文档。可以用最典型的问法，
#                                哪怕那句话同时是评测题 —— 无所谓
#   intent-fewshot.yml（本文件） 给模型看的样本。
#                                ★ 绝对不能是评测题，一句都不行
#
# ------------------------------------------------------------
# ★★ 为什么必须分开（踩过）
#
# 5.2 动工前对了一遍：树里那 55 条 examples 与 20 道评测题
# 【有 18 条逐字相同】——
#
#     B-001 退货要几天         ← RETURN_EXCHANGE 的示例就是这一句
#     B-009 优惠券怎么用       ← COUPON 的示例
#     B-011 价格保护怎么申请   ← PRICE_PROTECTION 的示例
#     B-017 这个适合送长辈吗   ← SCENARIO_PICK 的示例
#     ……（干净的只剩 B-014 / B-015）
#
# 成因是写树的时候为了「真实、有代表性」，直接从语料和已有的题里挑句子。
# 后果是：如果拿那 55 条当 few-shot，再拿 20 题测准确率，
# 测的就是「模型能不能把 prompt 里刚看过的句子照抄回来」，
# 而不是「能不能分类」。**整个 5.2 的验收会失去意义。**
#
# 根因是一个字段背了两个职责：「给人看的文档」要用典型问法，
# 「给模型的样本」不能用考题 —— 而「典型」和「不在考题里」在
# 只有 20 道题的现状下几乎冲突。所以拆成两份文件。
#
# ------------------------------------------------------------
# ★ 这份文件的纪律
#
#   1. 样本从【语料】里重新造，不是从评测集里挑
#   2. 每一句都不得与 `data/eval/baseline-questions.yml` 里的
#      `question` 字段重合 —— 这条由 `IntentFewShotTest` 强制，
#      不靠人记
#   3. 每个叶子至少 2 句。太少对 9B 这类小模型起不到作用；
#      太多会把 prompt 撑长，而分类是每次提问都要跑的
#
# ⚠️ 7.1 扩到 150 题时，新题可能会撞上这里的某一句。
#    撞了就跑测试 —— 它会告诉你撞的是哪一句、该换掉哪个。
#    （这正是把纪律做成断言的价值：树里那份 examples 每扩一次题
#      就要人工重查一遍，这份不用。）
#
# ------------------------------------------------------------
# 顶层键是【分类目标】的 code。共 16 个：
#
#   13 个业务叶子                       （retrieval=KB 的顶层展开到叶子）
#   + ORDER_LOGISTICS                   （TOOL 类，用【顶层】code —— 它的三个
#                                        工具叶子不是分类目标，选哪个工具是
#                                        5.9 的 function calling 干的事，见 ADR-035）
#   + OUT_OF_SCOPE                      （role=OUT_OF_SCOPE）
#   + NEEDS_CLARIFICATION               （role=CLARIFY，阶段 5.3 新增）
#
# 校验会检查每个 code 在树里是一个合法的分类目标。
# ============================================================

samples:

  # ---------- 商品咨询 ----------
  - intent: SPEC_QUERY
    questions:
      - 星辰X1 的屏幕是多少寸的
      - 电池是多少毫安的
      - 这款冰箱的噪音大不大
      - 支持多少瓦的快充

  - intent: USAGE_GUIDE
    questions:
      - 这个怎么连蓝牙
      - 第一次用需要激活吗
      - 充不进电是什么问题
      - 说明书上说的恢复出厂设置在哪

  # ---------- 购买决策 ----------
  - intent: SCENARIO_PICK
    questions:
      - 经常出差的人该买什么笔记本
      - 想给孩子买个上网课用的平板
      - 送女朋友什么比较合适
      - 家里有老人适合买哪种

  - intent: PURCHASE_TIMING
    questions:
      - 现在买还是再等等
      - 新款出来之后旧款会降价吗
      - 什么时候入手比较划算

  # ---------- 促销活动 ----------
  - intent: COUPON
    questions:
      - 这张券能用在哪些商品上
      - 我领的券怎么找不到了
      - 两张券能叠着用吗
      - 券能送人吗

  - intent: FULL_REDUCTION
    questions:
      - 满 500 减 100 是怎么算的
      - 秒杀一般几点开始
      - 抢到了没付钱会怎么样

  - intent: MEMBERSHIP
    questions:
      - 会员有什么好处
      - 怎么升级到钻石会员
      - 会员买东西会更便宜吗

  - intent: PRICE_PROTECTION
    questions:
      - 我买完第二天就降价了
      - 保价能保多久
      - 哪些情况不在保价范围

  - intent: TRADE_IN
    questions:
      - 我的旧手机能抵多少钱
      - 以旧换新怎么操作
      - 估完价要多久内下单

  # ---------- 售后服务 ----------
  - intent: RETURN_EXCHANGE
    questions:
      - 收到货不想要了怎么办
      - 寄回去的邮费怎么算
      - 什么情况下不能退
      - 能换成别的型号吗

  - intent: REFUND
    questions:
      - 退的钱什么时候能到
      - 会退到原来那张卡里吗
      - 用花呗付的怎么退

  # ★ 下面这几组里都有【带指代词但能回答】的样本 ——
  #   它们和 NEEDS_CLARIFICATION 的样本形成对照，教的是同一条判据的两面：
  #     「那个怎么样」——去掉指代词什么都不剩 → 澄清
  #     「这个保修多久」——去掉指代词还剩「保修多久」→ 归业务类别
  #   ⚠️ 缺了这一面，模型会学成「见「这个」就澄清」，
  #      把「这个有保修吗」这种本来答得了的问题也拿去反问用户。
  #      （2026-09-19 实测踩过：当时样本集是单边的，误判率 1/20。）
  - intent: WARRANTY
    questions:
      - 手机保修几年
      - 屏幕摔碎了保修吗
      - 这个保修多久
      - 保修要寄到哪里去

  - intent: RULES_AND_PROCESS
    questions:
      - 从哪儿能找到售后入口
      - 提交之后要等多久
      - 这个多久发货
      - 发票能补开吗

  # ---------- 订单物流（顶层 code，三个工具叶子合并） ----------
  - intent: ORDER_LOGISTICS
    questions:
      - 我买的东西到哪了
      - 我的快递怎么还没发
      - 订单显示已签收但我没收到

  # ---------- 兜底：不是我的业务 ----------
  - intent: OUT_OF_SCOPE
    questions:
      - 你好
      - 今天天气怎么样
      - 帮我写一首诗
      - 你是谁开发的

  # ---------- 澄清：是我的业务，但这句话没说清 ----------
  #
  # ★ 这一组是最难写的：它和 OUT_OF_SCOPE 的边界是「有没有提到本平台的业务」，
  #   和其他 13 个类别的边界是「单独拿出来能不能回答」。
  #   写样本时要保证【每一句都单独无法回答】，否则就是在教模型乱澄清。
  - intent: NEEDS_CLARIFICATION
    questions:
      - 那个怎么样
      - 它呢
      - 这个可以吗
      - 还有别的吗
      - 多少钱
      - 我想问一下
