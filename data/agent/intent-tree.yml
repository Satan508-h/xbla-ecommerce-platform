# ============================================================
# 意图树 —— 阶段 5.1
#
# 这份文件定义「用户到底在问什么」。它是阶段 5 的地基：
#
#   5.2 意图识别    把这份树拼进 prompt，让 LLM 选一个叶子码
#   5.3 置信度      低置信度时澄清反问（而不是猜）
#   5.4 意图定向检索 按叶子声明的 doc_types 收窄候选池
#   7.1 标注集      150 题的 intent 列从这个文件里取值
#
# ------------------------------------------------------------
# ★ 一、为什么是【树】而不是一张扁平列表
#
# 因为「用户想干什么」和「答案该去哪找」是两个粒度不同的问题：
#
#   顶层（5 类）：说人话的业务分类。客服培训会这么分，
#                 面试官问「你的意图怎么分的」也是在这一层回答。
#   叶子层：      才是检索策略。「价格保护」这个问题要去哪几个
#                 doc_type 里捞，是叶子才能回答的。
#
# 如果拍平成一个列表，「商品咨询」和「规格参数」就成了一对
# 互斥的同级选项 —— 而它们本来是包含关系。
#
# ------------------------------------------------------------
# ★★ 二、doc_types 的含义：【答案可能落在的全集】
#
# 它【不是】「5.4 要过滤成什么」，而是一个关于语料的【事实断言】：
#   「这类问题的答案，在语料里可能出现在这几种文档中。」
#
# 所以它允许重叠、允许多个。同一个 doc_type 会被多个叶子引用。
#
# 【为什么这个区分很重要】看 PRICE_PROTECTION：
#
#   问「价格保护怎么申请」，答案在三处，doc_type 各不相同：
#     促销活动规则 4.3 申请方式      doc_type = 3
#     价格保护政策 附加条件          doc_type = 2
#     售后FAQ「价保怎么申请」        doc_type = 4
#
#   所以它声明 [2, 3, 4]，这是事实。
#   至于 5.4 要不要拿它当 WHERE 条件、当软权重、还是干脆不用 ——
#   那是【另一个决策】，不该由这份文件替你回答。
#
# 分开的好处是：5.1 因此有了一个可自动验证的验收标准 ——
#
#     对评测集的每一题，该题的 gold doc_types 必须 ⊆
#     该题意图所声明的 doc_types。不满足 = 树画错了。
#
#   （已验证：20/20 通过。见 docs/05 §十）
#
# ⚠️ 如果没有这个区分，B-011 掉分时没人能说清是
#    「树错了」还是「过滤太激进」—— 两种原因的修法完全相反。
#
# ------------------------------------------------------------
# ★ 三、为什么 OUT_OF_SCOPE 存在，但【不算】5 类之一
#
# 路线图 7.1 写的是「150 题覆盖 5 类意图」。如果兜底也占一个名额，
# 那 5 类里就有 1 类是「以上皆非」—— 它在评测集里【无法定义 ground truth】：
# 其他类的 expected_chunk_ids 是 [123, 456]，兜底类的只能是空集。
# 同一个列承载两种形状的语义，7.2 算指标时每处都要先判断「这题是不是兜底」。
#
# 所以：5 类业务意图 + 1 个 OUT_OF_SCOPE 分支。
# 指标也拆成两个，因为它们是两种性质相反的错：
#     Top-1 意图准确率  ← 分母 = 5 类业务意图的题
#     越界率            ← 本该兜底却被判成业务意图的比例
# 混在一起算，一个指标里两种错会互相抵消。
#
# ------------------------------------------------------------
# 字段说明
#
#   顶层
#     code         大写下划线，全局唯一。7.1 标注时抄的就是它
#     name         中文名，给人看
#     description  给 LLM 看的判据。★ 必须包含「边界」——
#                  写清楚「什么不算这一类」，比写「什么算」更有用
#     answer_style 给 LLM 的回答风格指令（一句话）。
#                  ★ 商品咨询和购买决策的检索行为【完全相同】
#                    （都不加 doc_type 过滤），所以它们能分开的
#                    唯一理由就是这里
#     retrieval    检索策略：KB 知识库 / TOOL 实时工具 / NONE 不检索
#     role         三种角色，互斥，默认 BUSINESS：
#                    BUSINESS      业务意图。只有它计入「5 类」
#                    OUT_OF_SCOPE  与业务完全无关（问候、闲聊）
#                    CLARIFY       业务相关，但这句话没说清（指代不明、缺主语）
#
#   ★ role 用枚举而不是布尔量，是因为这三者是【互斥】的三种角色 ——
#     两个布尔量可以同时为真，而那个状态无意义、只能靠校验拦。
#     ★★ 更要紧的是后两者的语义差别很大，混起来用户会拿到错误的回答：
#          「那个怎么样」被塞进 OUT_OF_SCOPE 时，用户收到的是
#          「我只处理商品导购与售后问题」—— 而那句话明明就是在问商品。
#
#   叶子
#     code              大写下划线，全局唯一
#     doc_types         答案可能落在的 doc_type 全集（见上面第二节）
#     structured_facts  可选，阶段 5.9 加。这类问题除检索外还要不要
#                       额外带一份【结构化事实】进 prompt。目前只有
#                       POLICY（after_sale_policy 的退货/换货天数）一个值。
#                       ★ 它是【叶子】粒度，和 retrieval 的顶层粒度刻意不同 ——
#                         「要不要带硬数据」不是整类的性质。
#                       ★ 它不参与分类（classificationTargets 只看 retrieval），
#                         所以加它【不影响】5.2 的意图准确率基线。
#                       ⚠️ 非 retrieval=KB 的叶子写了它会【启动即崩】——
#                          走工具那条路根本不组装 prompt，写了也不会生效。
#     examples          真实问法，5.2 当少样本示例用
#     note              给人看的备注，程序不用
#
# doc_type 词表（与 kb_document.doc_type 的 CHECK 约束一致）：
#   1 商品详情   2 售后政策   3 促销规则   4 FAQ   5 说明书
# ============================================================

version: 1

intents:

  # ==========================================================
  # 一、商品咨询 —— 「这东西是什么」
  # ==========================================================
  - code: PRODUCT_INQUIRY
    name: 商品咨询
    description: |
      用户在了解某款商品【本身】：它有哪些参数、怎么操作、有什么卖点。
      问的是客观事实，语料里有明确答案。

      不算这一类的情况：
        - 问「我该不该买 / 哪个更好」→ 那是购买决策（求建议，不是求事实）
        - 问「什么时候降价」→ 那是购买决策或促销活动
        - 问买完之后的事 → 那是售后服务
    answer_style: 客观陈述文档里写了的参数与操作步骤，不推测、不建议、不与别的商品比较。
    retrieval: KB
    children:
      - code: SPEC_QUERY
        name: 规格参数
        description: 商品本身的参数与规格数值；也包括「某个参数是什么意思」。问的是客观数值或定义，不是建议。
        doc_types: [1, 5]
        note: |
          商品详情里渲染出来的「规格参数」小节，以及说明书的参数表。
          也包括「某个参数是什么意思」——那是在解释参数，不是在给建议。
        examples:
          - 星辰X1 电池容量多大
          - 笔记本处理器后缀 U 和 H 有什么区别
          - 这款冰箱的能效等级是多少
          - 屏幕刷新率 120Hz 是什么意思

      - code: USAGE_GUIDE
        name: 使用操作
        description: 拿到商品之后怎么用：开机、充电、按键、指示灯，以及常见故障的排查步骤。
        doc_types: [5]
        note: 说明书独有。开机、充电、按键、指示灯、常见故障 —— 都是「怎么用」而不是「是什么」。
        examples:
          - 星辰X1 怎么开机
          - 充电要充多久
          - 指示灯一直闪红灯是什么意思

  # ==========================================================
  # 二、购买决策 —— 「我该不该买 / 买哪个」
  # ==========================================================
  #
  # ★ 这一类与商品咨询的【检索行为完全相同】（都是 retrieval: KB，
  #   且都不加 doc_type 过滤）。它们能作为两个顶层意图并存，
  #   唯一的理由就是 answer_style 不同：
  #     商品咨询 → 「电池 5000mAh」（陈述）
  #     购买决策 → 「建议选 1.3kg 以内的，因为通勤要背一整天」（建议 + 依据）
  #   如果哪天发现这两类的回答风格其实一样，就应该合并掉一个。
  - code: PURCHASE_ADVICE
    name: 购买决策
    description: |
      用户在问「我该不该买」「买哪个」「什么时候买」——
      要的是【建议和判断依据】，不是商品参数本身。

      不算这一类的情况：
        - 只问参数数值 → 那是商品咨询（SPEC_QUERY）
        - 问「现在有什么优惠」→ 那是促销活动（问的是规则，不是建议）
    answer_style: 给出明确的选购建议并说明依据；可以对比多个选项，但必须指出各自适合什么人。
    retrieval: KB
    children:
      - code: SCENARIO_PICK
        name: 按场景选购
        description: 问「某类人 / 某个用途适合买什么」，要的是选购建议和判断依据，不是某一款商品的参数。
        doc_types: [1]
        note: 商品导购指南「一、按使用场景选购」的三个小节直接对应这里的三种问法。
        examples:
          - 这个适合送长辈吗
          - 商务人士选笔记本看什么
          - 学生买平板要注意什么

      - code: PURCHASE_TIMING
        name: 购买时机
        description: 问「什么时候买划算」：大促节点、新品与旧款的时机、活动的时间窗口。
        doc_types: [1, 3]
        note: |
          导购指南「三、购买时机」讲大促节点和新旧款，
          促销规则讲具体活动的时间窗口 —— 两者都回答「什么时候买」。
        examples:
          - 什么时候买手机最划算
          - 新品上市后旧款会降价吗
          - 大促一般是什么时候

  # ==========================================================
  # 三、促销活动 —— 「有什么优惠 / 怎么用」
  # ==========================================================
  - code: PROMOTION
    name: 促销活动
    description: |
      用户在问优惠的规则：怎么用、能不能叠加、什么时候生效、
      过期了怎么办、降价了能不能退差价、会员身份有什么权益。

      不算这一类的情况：
        - 问「我要不要趁活动买」→ 那是购买决策（求建议）
        - 问退款本身怎么退 → 那是售后服务（钱怎么回来是售后的事，
          虽然券的规则是促销的事 —— 这个边界见 COUPON 的说明）
        - 问「我还有几张券」→ 那是订单物流（主语是「我的」，要查账户）
    answer_style: 直接给出规则里的数值与条件；涉及金额、时限时必须写清单位和起止时点。
    retrieval: KB
    children:
      - code: COUPON
        name: 优惠券
        description: 优惠券怎么用、能不能叠加、有效期、过期怎么办、能不能转赠。
        doc_types: [3, 4]
        note: |
          ★ doc_type=4（售后FAQ）在这里不是笔误。
          售后FAQ 里有一整类「优惠券过期了能补吗」「优惠券可以叠加吗」
          的问答对 —— FAQ 天然是跨业务域的，它同时答售后和促销。
          所以 5.4 过滤时写成 doc_type = 3 会切掉一半答案，
          这就是为什么 doc_types 要声明【全集】而不是「主类型」。
        examples:
          - 优惠券怎么用
          - 优惠券过期了怎么办
          - 满减活动能和优惠券一起用吗
          - 优惠券能转给别人吗

      - code: FULL_REDUCTION
        name: 满减与秒杀
        description: 满减活动的计算与叠加规则；限时秒杀的开始时间与未付款的处理。
        doc_types: [3, 4]
        note: |
          促销活动规则「一、满减活动」和「三、限时秒杀」——它们在 doc_type=3。
          ★ 但 4 不是多余的：售后FAQ 的「促销」分类里有
          「秒杀没付款会怎样 | 十五分钟内未支付订单自动取消」这一条。
          最初这里只写了 [3]，是照着「秒杀属于促销规则」的直觉写的，
          查了 FAQ 的实际内容才发现漏了 —— 这正是 doc_types 必须
          用【实际语料】而不是【直觉】来填的原因。
        examples:
          - 满减怎么算
          - 秒杀活动什么时候开始
          - 秒杀抢到了没付款会怎样
          - 满 300 减 50 可以和别的活动一起用吗

      - code: MEMBERSHIP
        name: 会员权益
        description: 会员等级带来的长期权益：折扣力度、专属服务、怎么升级。
        doc_types: [4]
        note: |
          会员等级带来的折扣力度和专属服务。
          它【不是】某一次活动的优惠，而是长期身份带来的权益，
          所以和上面四个叶子都不同类。
          ★ 这一条是排查「树有没有漏掉语料里的内容」时发现的：
          售后FAQ 有一条「会员等级有什么用 | 等级越高享受的折扣力度越大，
          钻石会员可享受专属客服」，当时树上没有任何一个叶子能接住它。
          如果放着不管，7.1 标注时这道题只能被硬塞进 FULL_REDUCTION
          （错）或 OUT_OF_SCOPE（更错 —— 它明明答得出来）。
        examples:
          - 会员等级有什么用
          - 怎么成为钻石会员
          - 会员折扣能和优惠券一起用吗

      - code: PRICE_PROTECTION
        name: 价格保护
        description: 买完之后商品降价了能不能退差价、怎么申请、保价期多久、哪些不在保价范围。
        doc_types: [2, 3, 4]
        note: |
          ★★ 这道题是整套意图定向检索的【压力测试】，故意保留。
          它的答案在三处，横跨三种 doc_type：
            促销活动规则 4.3 申请方式      doc_type = 3
            价格保护政策 附加条件          doc_type = 2
            售后FAQ「价保怎么申请」        doc_type = 4
          无论把它路由到「促销活动」还是「售后服务」，
          只要 5.4 做了硬过滤，就必然切掉一部分正确答案。
          这不是树的缺陷，是语料的真实形态 —— 同一条规则被写在了三份文档里。
        examples:
          - 价格保护怎么申请
          - 保价期是多久
          - 买完降价了能退差价吗

      - code: TRADE_IN
        name: 以旧换新
        description: 旧机估价、能抵多少钱、怎么参与、估价的有效期。
        doc_types: [2]
        note: |
          「以旧换新服务说明」在库里是 doc_type=2（它作为一条售后政策同步进来的），
          而不是 3。这是库里的既成事实，树如实记录 —— 不为了「看起来整齐」而写 3。
        examples:
          - 旧机估价有效期多久
          - 以旧换新怎么参与
          - 旧手机能抵多少钱

  # ==========================================================
  # 四、售后服务 —— 「买完之后出问题了」
  # ==========================================================
  #
  # ★ 这是本项目【问题最密集】的意图：20 道基线题里 11 道属于它，
  #   而它对应的切片只有 67 条（占全库 4.1%）。
  #   4.1% 的切片回答 55% 的问题 —— 这就是「只对窄类型过滤」
  #   能拿到收益的根本原因。
  - code: AFTER_SALE
    name: 售后服务
    description: |
      订单成交【之后】发生的事：退换货、退款、保修维修、发票、物流损坏，
      以及各品类的差异化售后规则。

      不算这一类的情况：
        - 问「我的订单现在到哪了」→ 那是订单物流（要查实时数据，知识库答不了）
        - 问「这个商品保修几年」如果问的是商品参数本身 → 商品咨询
    answer_style: 给出时限、条件、以及用户需要做的具体动作（去哪点、传什么材料）；有品类差异时必须说明适用于哪个品类。
    retrieval: KB
    children:
      - code: RETURN_EXCHANGE
        name: 退换货
        description: 退货 / 换货的适用条件与时限，以及附加条件（拆封算不算、哪些商品除外）。
        doc_types: [2, 4]
        structured_facts: POLICY
        note: |
          退换货的条件、时限、附加条件（拆封算不算、定制类除外）。用户做得最多的售后动作。

          ★★ structured_facts: POLICY 是【阶段 5.9】加的，而且【只有这一个叶子】有。
          理由：这份硬数据只有一项内容 —— after_sale_policy 的
          return_days / exchange_days，即「退货几天 / 换货几天」。
          整个售后分支里真正需要这个准确值的只有这一片叶子：
            退款（REFUND）      问的是到账时间，结构化字段里没有
            保修（WARRANTY）    问的是保修年限，也不在结构化字段里
            规则流程（RULES）   问的是流程和发票，同上
            价格保护（PROMOTION.PRICE_PROTECTION）保价 15 天写在 content 里，字段是空的
          所以别为了「看起来整齐」把它抄到兄弟叶子上 —— 抄过去只会给
          prompt 增加一段和问题无关的文字，而且会让「哪些叶子真的需要它」
          这件事再也看不出来。

          ★ 为什么不注入 conditions：它【已经在知识库里】
          （实测 12 条「附加条件」切片，形如「电脑类商品售后规则 > 附加条件」）。
          注入它就是重复。而天数在 content 里是【散文】
          （「自签收之日起 7 天内支持无理由退货，15 天内支持换货」）——
          从散文里读数字可能读错、可能把退货和换货的天数张冠李戴，
          这才是这份硬数据存在的全部价值。
        examples:
          - 退货要几天
          - 拆封了还能退货吗
          - 换货的条件是什么
          - 退货运费谁承担
          - 七天无理由退货有什么附加条件

      - code: REFUND
        name: 退款
        description: 钱怎么回来：到账时间、是否原路返回、不同支付方式的差异。与退换货的分界是「货怎么回去」vs「钱怎么回来」。
        doc_types: [2, 4]
        note: 钱怎么回来 —— 到账时间、原路返回、不同支付方式差异。与「退货」分开：退货是货怎么回去，退款是钱怎么回来。
        examples:
          - 退款多久到账
          - 退款是原路返回吗
          - 微信支付退款要几天

      - code: WARRANTY
        name: 保修维修
        description: 保修期限与范围、人为损坏是否免费、送修流程、过保了还能不能修。
        doc_types: [2, 4, 5]
        note: |
          保修期限与范围、维修流程、以及「要不要花钱 / 找谁修」这类责任问题。

          ⚠️ 2026-09-20 改过一次：原来这行还写着「常见故障怎么处理」，
          与 USAGE_GUIDE 的判据**撞了车**。撞车的代价不是「多标一道题」——
          ★ IntentPromptBuilder 把 description 逐字拼进分类 prompt，
            两个叶子都说自己管常见故障，就是**两条互相竞争的判据进了同一个 prompt**。
            而没有任何测试会报错：两个叶子的 doc_types 都含 5，
            IntentTreeConsistencyTest 照样绿（它查的是「gold ⊆ 声明」）。
          ★ 判据改成一件事：问的是【操作】还是【责任】。
              充电口松了怎么清理        → 操作 → USAGE_GUIDE
              充电口松了保修吗 / 要花钱吗 → 责任 → WARRANTY

          ★ doc_type=5 保留，但理由是**换过的**：不是「说明书讲故障」，
          而是说明书里有一句跨到售后的 ——「若仍无法充电，请联系售后服务」。
          doc_types 声明的是「答案可能存在的完整集合」，
          那句话让说明书成为保修问题的一个合法出处。★ 宁宽勿窄。
        examples:
          - 保修期是多久
          - 坏了去哪修
          - 过保了还能修吗

      - code: RULES_AND_PROCESS
        name: 售后规则与流程
        description: 售后流程类问题：怎么发起售后、审核要多久、发票怎么开与重开、收到货发现损坏怎么办、怎么查物流。
        doc_types: [2, 4]
        note: |
          四类问题的合称，它们在现有语料上指向完全相同的 doc_types，
          拆开只会让 5.2 在相邻叶子之间摇摆而不产生任何检索差异：
            · 怎么发起售后（流程）
            · 审核要多久（时效）
            · 发票怎么开（凭证）
            · 收到货发现损坏（物流损坏 —— 它虽然发生在物流环节，
              但处理方式是售后流程的一部分）
          ⚠️ 合并的代价：7.2 想单看「发票类问题答得怎么样」时算不出来。
             真需要时再拆，拆的成本是改这一处 + 重新标 intent 列。
        examples:
          - 怎么申请售后
          - 售后审核要多久
          - 发票能开纸质的吗
          - 收到货发现损坏怎么办
          # ★ 「怎么查询物流」在这里，不在 ORDER_LOGISTICS ——
          #   它问的是【通用流程】（去哪点、看什么），知识库答得出来。
          #   而「我的订单到哪了」问的是【这一笔单子的实时状态】，
          #   必须查数据库。两者的区别是「通用规则 vs 具体数据」，
          #   不是「物流 vs 售后」。
          - 怎么查询物流

  # ==========================================================
  # 五、订单物流 —— 「我的那一笔单子」
  # ==========================================================
  #
  # ★ 这一类【不检索知识库】。用户问的是实时数据，静态文档里没有答案。
  #   它由 MCP 工具承接（5.7 手写 Server / 5.8 官方 SDK 做 Client / 5.9 四个工具）。
  #   在 5.7 落地之前，这一类走到这里会得到一个「工具尚未接入」的诚实回复 ——
  #   这比拿知识库里的通用规则去糊弄要好。
  - code: ORDER_LOGISTICS
    name: 订单物流
    description: |
      用户在问【自己的】那一笔具体的订单：到哪了、还有没有货、我的券还在不在。
      需要查实时数据库，知识库里没有答案。

      不算这一类的情况：
        - 问「一般发货要几天」这种通用规则 → 那是售后服务
        - 问「库存不足会怎样」这种规则 → 那是售后服务
    answer_style: 只陈述查到的实时数据；查不到就如实说明查不到，不要用知识库里的通用规则替代。
    retrieval: TOOL
    children:
      - code: ORDER_STATUS
        name: 订单状态
        description: 「我的」那一笔订单现在到哪了、发货了没有、预计什么时候到。
        doc_types: []
        examples:
          - 我的订单到哪了
          - 我上周买的东西发货了吗
          - 订单什么时候能到

      - code: INVENTORY
        name: 库存查询
        description: 某款商品现在还有没有货、什么时候补货。问的是某个具体商品的实时库存，不是它好不好。
        doc_types: []
        examples:
          - 这款还有货吗
          - 星辰X1 什么时候补货
          - 星空蓝还有库存吗

      - code: MY_COUPON
        name: 我的优惠券
        description: 「我」账户里有哪些券、什么时候过期、为什么用不了。
        doc_types: []
        note: |
          ⚠️ 与 PROMOTION.COUPON 的边界：问「优惠券怎么用」是规则（促销活动），
          问「我还有几张券」是查自己的账户（订单物流）。判定依据是
          句子里的主语是不是「我的」。
        examples:
          - 我有哪些优惠券
          - 我的券什么时候过期
          - 我的优惠券怎么用不了

  # ==========================================================
  # 非业务分支（两者都 role != BUSINESS，都不计入 5 类）
  # ==========================================================
  #
  # ★ 这两者的语义差别很大，不能混。区别是：
  #     OUT_OF_SCOPE  不是我的业务   → 「我只处理导购和售后问题」
  #     CLARIFY       是我的业务，但你得再说点 → 「你指的是哪款商品？」
  #
  # ★ 定义 `CLARIFY` 的直接原因是实测（2026-09-19）：
  #   在没有这个选项时，分类器对「那个怎么样」给出的是一个【自信的】
  #   OUT_OF_SCOPE。而「那个怎么样」明明就是在问某个商品 —— 它不属于
  #   「与业务无关」，它属于「业务相关但信息不足」。

  - code: OUT_OF_SCOPE
    name: 超出服务范围
    role: OUT_OF_SCOPE
    description: |
      与商品、促销、售后、订单都无关的输入：闲聊、问候、
      以及本平台确实回答不了的问题（比如「帮我写首诗」）。

      ★ 判据是「这个问题能不能用本平台的资料回答」，
        而不是「这句话礼不礼貌」。「你好」属于这里。

      不算这一类的情况：
        - 在问本平台的商品/促销/售后/订单，只是没说清楚 → 那是信息不足
        - 虽然是短问题但能独立回答（「多少钱」「怎么退」）→ 归对应业务类别
    answer_style: 简短说明自己只处理商品导购与售后问题，并给出可以问的方向；不要编造答案。
    retrieval: NONE
    children: []

  - code: NEEDS_CLARIFICATION
    name: 信息不足
    role: CLARIFY
    description: |
      用户在问本平台【业务范围内】的事，但这句话本身不足以判断他到底想问什么：
      指代不明（「那个怎么样」）、缺主语（「多少钱」）、信息太少（「还有别的吗」）。

      ★ 判据是「这句话【单独拿出来】能不能回答」。
        不能回答就要反问澄清，而不是猜一个类别去检索 ——
        猜错的代价是用户拿到一段完全不相关的回答，而他不会知道是猜错了。

      不算这一类的情况：
        - 与业务完全无关          → OUT_OF_SCOPE
        - 短，但单独拿出来就能回答 → 归对应业务类别
          （「怎么退」能答 —— 退货流程是通用的；
            而「多少钱」不能 —— 既不知道哪款商品，也不知道问的是哪个价）
        - ★ 带指代词，但【其余部分已经足以回答】→ 归对应业务类别
          （「这个怎么退货」—— 退货流程是通用的，知不知道是哪款商品都一样；
            「这个多久发货」—— 发货时效也是通用的）
          指代词不等于信息不足。判据是「去掉指代词之后，这句话还能不能回答」。

      ★ 所以判据不是「句子长不长」、也不是「有没有「这个」「那个」」，
        而是「**单独**能不能回答」。
        短问题照样可能是完整问题（「多少钱」短，但它确实答不了）；
        长问题也可能全是代词。
    answer_style: 用一句反问请用户补充最关键的那项信息（型号 / 场景 / 具体想了解什么）；不要罗列一堆问题，只问一个。
    retrieval: NONE
    children: []
