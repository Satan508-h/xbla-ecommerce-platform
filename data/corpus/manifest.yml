# ============================================================
# 语料清单 —— 声明 data/corpus/ 里每份文档的 doc_type
#
# 扫描接口（POST /api/kb/documents/scan）读这个文件，
# 而不是用 URL 上的 ?docType= 参数给整个目录定一个类型。
#
# ------------------------------------------------------------
# ★ 为什么需要这个文件（踩过一次）
#
# 原来的做法是扫描时统一传 ?docType=2，于是目录里 18 份文件
# 【全部】被标成「售后政策」—— 包括促销活动规则、售后FAQ、
# 商品说明书、商品导购指南。错得非常安静：入库全成功，状态全正常，
# 只有 doc_type 列是错的。
#
# 而 doc_type 是阶段 5 意图定向检索的过滤条件（「用户问售后 →
# 只在 doc_type=2 的切片里搜」）。标错的直接后果是
# 【某一类查询永远返回空】，而且症状和「知识库里确实没有」完全一样，
# 极难排查。所以标注这件事必须在源头是显式的。
#
# ------------------------------------------------------------
# ★ 为什么不用「文件名启发式」（看到"说明书"就判 5）
#
# 文件名是可以变的，而启发式对不认识的名字会【静默】给一个默认值。
# 加一份「2026春季新品.md」，启发式认不出来 → 落进默认类型 →
# 又一次安静地标错。显式清单的代价是每加一个文件要写一行，
# 换来的是「没声明」这件事本身是可见的（扫描时会打 WARN）。
#
# ------------------------------------------------------------
# doc_type 词表（与 kb_document.doc_type 的 CHECK 约束一致，1~5）
#
#   1 = 商品详情     2 = 售后政策     3 = 促销规则
#   4 = FAQ          5 = 说明书
#
# ⚠️ 清单里没有的文件不会被跳过 —— 会回落到 URL 上的 ?docType=
#    参数并打一条 WARN，避免「加了文件却忘了登记」变成静默行为。
# ============================================================

files:

  # ---------- 售后政策 ----------
  - name: 售后政策汇编.docx
    doc_type: 2
    note: Word，用真正的 Heading 1/2/3 样式。正文里直接有 h 标签

  - name: 售后FAQ.xlsx
    doc_type: 4
    note: Excel 两列问答表。sheet 名变成 h1，表格行拼成文本

  # ---------- 促销规则 ----------
  - name: 促销活动规则.md
    doc_type: 3
    note: Markdown，用 # 号。Tika 没有 Markdown 解析器，靠行首模式识别

  # ---------- 说明书 ----------
  - name: 商品说明书-星辰X1.pdf
    doc_type: 5
    note: PDF，用文档大纲（bookmark）标记标题。正文里一个 h 标签都没有

  # ---------- 商品类内容 ----------
  - name: 商品导购指南.md
    doc_type: 1
    note: |
      ★ 归 1（商品详情）是个【判断】，不是词表里的精确匹配。
      它是一份跨品类的选购指南（按场景选购 / 参数怎么看 / 购买时机 /
      常见误区），词表里没有「导购指南」这一档。

      归 1 的理由：它回答的是「适合送长辈吗」这类【商品咨询】，
      而阶段 5 的意图路由里，商品咨询 → doc_type=1 是最简单的映射。
      若为它单独加一个 6，意图映射就得多维护一个值（商品咨询 → {1,6}），
      而且要改 CHECK 约束。

      ⚠️ 代价是列注释「商品详情」比它实际承载的含义窄了一点。
      阶段 5 定义意图树时如果发现这个归类不合适，改这一行即可
      —— 重新扫描会把这个 doc_type 校正过去（见 KbIngestServiceImpl
      的 reconcile 逻辑），不需要重新向量化。
