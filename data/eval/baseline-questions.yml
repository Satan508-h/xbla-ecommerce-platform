# ============================================================
# 阶段 4 基线评测集 —— 20 题
#
# 构造方式：从真实语料【反向构造】。先看 kb_chunk 里的实际切片，
# 针对它写一个答案唯一的问题，再把那段话里的一个独有片段作为锚点。
#
# ⚠️ 诚实性声明（必须写进评测报告）
#   这样构造出来的问题比真实用户提问【简单】—— 因为问题是从答案反推的，
#   用词天然贴近原文。所以本文件算出的召回率【不是】线上真实水平，
#   只能作为「同一套题、不同配置之间」的相对比较基线。
#   阶段 7 才会用人工标注的 150 题（含真实用户分布）做正式评测。
#
# ------------------------------------------------------------
# ★ 为什么存「锚点」而不是 chunk_id
#
# kb_chunk.id 是 BIGSERIAL，每台机器、每次重灌语料都不一样。
# 把硬编码的 id 提交进 git，换台机器后 ground truth 就全部失效 ——
# 而且【不会报错】，只会让 Recall@K 变成 0 或者随机数。
# 这正是「阶段 7 没法做 A/B 对比」最隐蔽的一种成因。
#
# 锚点是那段切片里【独有的一段原文】，加载时用
#     SELECT id FROM kb_chunk WHERE content LIKE '%锚点%'
# 解析出来。命中 0 条或 >1 条都【直接抛异常】——
# 静默取第一条会让基线悄悄漂移，而评测系统最不能犯的错就是「悄悄」。
#
# ------------------------------------------------------------
# category 字段 = 查询形态，【不是】意图
#   keyword    —— 词典型（「优惠券怎么用」）
#   model      —— 型号型（「星辰X1 电池」）
#   colloquial —— 口语句（「这个适合送长辈吗」）
# 三类查询在两条召回路上的表现本来就不同，基线报告必须按它切片。
#
# ------------------------------------------------------------
# ★ intent 字段（2026-09-19 阶段 5.1 新增，现在是【必填】）
#
# 取值必须是 data/agent/intent-tree.yml 里的某个【叶子】code。
# 阶段 4 时这里写的是 UNCLASSIFIED 占位值，理由是「意图树还没定义」——
# 现在定义了，那个理由就不成立，所以改成必填：缺了会直接导致
# POST /api/debug/eval/reload 失败（和锚点解析不唯一一样吵）。
#
# 为什么存【叶子】code 而不是顶层 code（如 PRODUCT_INQUIRY）：
# 顶层码可以由树 roll-up 算出来，反过来推不出来。
# 只存顶层，「价格保护这类题答得怎么样」就永远算不出来。
#
# ★ 判据是【只读这个问题，它在问什么】，不是【答案落在哪个 doc_type】。
#   后者是树的责任 —— 由一个自动校验盯着：
#      该题 gold 的 doc_types 集合 ⊆ 该题 intent 声明的 doc_types 集合
#   见 IntentTreeConsistencyTest。不满足 = 树画错了，而不是题标错了。
#
# ============================================================
# ★★ 2026-09-19 修订：gold 从「单答案」改为「多答案」
#
# 【问题】原来的每题只标【一个】正解切片。这个假设在语料上不成立 ——
#   同一批业务规则被【多个文档】覆盖：
#
#     优惠券   → 促销活动规则(6片) + 售后FAQ(3片) + 退款说明(1片) + 以旧换新(1片)
#     价保     → 促销活动规则(3片) + 售后FAQ(2片) + 价格保护政策(2片)
#     发票     → 售后FAQ(2片) + 七天无理由退货政策(1片) + 发票说明(2片)
#     退款/换货 → 售后FAQ + 售后政策汇编 + 退款到账时间说明
#
#   后果：重排把【另一个同样正确的答案】提到前面时，MRR 会把它记成「变差」。
#   实测 4 道「重排导致 MRR 下降」的题里，3 道属于这种情况：
#
#     B-011「价格保护怎么申请」原 gold 是 109（价格保护政策 > 附加条件
#          「需提供降价截图；每笔订单仅可申请一次」），而「怎么申请」的
#          真正答案是 13（促销活动规则 4.3 申请方式）和 28（售后FAQ
#          「价保怎么申请」）。【原 gold 本身就是标错的】。
#
#   这不是重排的问题，是【评测集的问题】。单答案 MRR 在多答案语料上
#   度量的是「有没有命中标注者随手挑的那一片」，不是「有没有答对」。
#
# 【修法】把每道题的【所有合法答案】都补进 anchors。
#   判断依据只有一条：**只读这一段文字 + 问题，它是否回答了问题**。
#   ⚠️ 不允许因为「重排把它提上来了」就补进去 —— 那是拿系统输出
#      拟合标准答案，评测就废了。反例见 B-013：重排把 30
#      （售后FAQ「可以开【电子】发票吗」）提到了 110 前面，
#      但问题问的是【纸质】发票，30 没有回答它，所以【不补】。
#
# 【副作用，必须知道】补全 gold 后 Recall@K 的分母变大，
#   而 MRR@K 取的是「第一条命中的名次」—— 所以两项指标的数值都会变，
#   不能和 2026-09-19 之前的报告直接比。见 docs/06 §3.2。
# ============================================================

questions:

  # ---------- 售后政策（8 题）----------
  - question_no: B-001
    question: 退货要几天
    category: colloquial
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 审核通过、商品寄回并验收合格后，退款在三个工作日内发起。
    anchors:
      - text: 审核通过后，商品寄回并验收合格，退款在三个工作日内发起
        doc_hint: 售后FAQ
      # 同一条规则在政策文档里的另一种表述
      - text: 商品退回并经平台验收合格后，退款将在三个工作日内发起
        doc_hint: 售后政策汇编 2.3

  - question_no: B-002
    question: 退款多久到账
    category: keyword
    difficulty: 1
    intent: REFUND
    expected_answer: 原路退回。余额支付实时到账，银行卡支付三到十五个工作日。
    anchors:
      - text: 原路退回。余额支付实时到账，银行卡支付三到十五个工作日
        doc_hint: 售后FAQ
      # 下面两条是同一件事的另外两种写法，都直接回答了「多久到账」
      - text: 微信/支付宝支付通常 24 小时内到账；银行卡支付因银行处理时效不同，可能需要 3-7 个工作日
        doc_hint: 退款到账时间说明
      - text: 商品退回并经平台验收合格后，退款将在三个工作日内发起
        doc_hint: 售后政策汇编 2.3

  - question_no: B-003
    question: 拆封了还能退货吗
    category: colloquial
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 普通商品拆封但包装完整的可以退；数码产品激活后不支持无理由退货。
    anchors:
      - text: 普通商品拆封但包装完整的可以退
        doc_hint: 售后FAQ
      - text: 拆封但未损坏包装的视为包装完整
        doc_hint: 售后政策汇编 2.1（正面回答「拆封算不算影响二次销售」）
      - text: 手机、电脑等数码产品拆封激活后不支持无理由退货
        doc_hint: 七天无理由退货政策（例外情形的直接回答）

  - question_no: B-004
    question: 退货运费谁承担
    category: keyword
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 质量问题由平台承担，无理由退货由用户承担。
    # ★ 这条规则在 2 条切片里都出现（两份【不同】文档，不是重复灌入）：
    #   18 = 售后FAQ 的对应行
    #   59 = 售后政策汇编「4.2 寄回与验收」
    #   两条都能回答这个问题，所以命中文中任意一条都算检索成功。
    #   （2026-09-19 之前这里还有第 3 条 77，那是重复入库的
    #    售后政策汇编.pdf，已删除）
    allow_multiple: true
    anchors:
      - text: 质量问题由平台承担，无理由退货由用户承担
        doc_hint: 售后FAQ（及售后政策汇编 4.2）
      - text: 退货运费由消费者承担；若为商品质量问题，运费由平台承担
        doc_hint: 七天无理由退货政策

  - question_no: B-005
    question: 怎么申请售后
    category: keyword
    difficulty: 1
    intent: RULES_AND_PROCESS
    expected_answer: 在「我的订单」中找到订单，点击「申请售后」填写信息并上传照片。
    anchors:
      - text: 在「我的订单」中找到订单，点击「申请售后」填写信息并上传照片
        doc_hint: 售后FAQ
      - text: 点击「申请售后」，选择退货或换货，填写申请原因并上传商品照片
        doc_hint: 售后政策汇编 4.1

  - question_no: B-006
    question: 售后审核要多久
    category: keyword
    difficulty: 1
    intent: RULES_AND_PROCESS
    expected_answer: 通常在二十四小时内完成审核。
    anchors:
      - text: 通常在二十四小时内完成审核
        doc_hint: 售后FAQ
      - text: 审核通常在二十四小时内完成
        doc_hint: 售后政策汇编 4.1（同一条规则的另一种表述）

  - question_no: B-007
    question: 换货的条件是什么
    category: keyword
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 签收后十五天内出现质量问题，外观完好、配件齐全即可申请换货。
    anchors:
      - text: 签收后十五天内出现质量问题，外观完好、配件齐全即可申请换货
        doc_hint: 售后FAQ
      - text: 商品自签收之日起十五天内出现质量问题的，用户可以申请换货
        doc_hint: 售后政策汇编 3.1

  - question_no: B-008
    question: 七天无理由退货有什么附加条件
    category: keyword
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 手机、电脑等数码产品拆封激活后不支持；定制类商品不支持。
    anchors:
      - text: 手机、电脑等数码产品拆封激活后不支持无理由退货
        doc_hint: 七天无理由退货政策 附加条件
      # 「附加条件」既包括商品本身的准入要求，也包括排除项 —— 两条都要算
      - text: 自签收之日起 7 天内，商品未拆封、不影响二次销售的，支持无理由退货
        doc_hint: 七天无理由退货政策（正面的准入条件）
      - text: 以下商品不适用七天无理由退货：消费者定作的商品
        doc_hint: 售后政策汇编 2.2（排除项清单）

  # ---------- 促销政策（4 题）----------
  - question_no: B-009
    question: 优惠券怎么用
    category: keyword
    difficulty: 1
    intent: COUPON
    expected_answer: 每笔订单限用一张，不可拆分、不可兑换现金、不可转赠。
    anchors:
      - text: 每笔订单限用一张优惠券。优惠券不可拆分使用，不可兑换现金，不可转赠他人
        doc_hint: 促销活动规则 2.2 使用限制
      # 「怎么用」包含「能用在哪」—— 适用范围同样是这个问题的答案
      - text: 标注了适用类目的优惠券只能在对应类目的商品上使用
        doc_hint: 促销活动规则 2.3 适用范围

  - question_no: B-010
    question: 优惠券过期了怎么办
    category: keyword
    difficulty: 1
    intent: COUPON
    expected_answer: 有效期以券面标注为准，过期后自动失效，不予补发。
    anchors:
      - text: 优惠券的有效期以券面标注为准，过期后自动失效，不予补发
        doc_hint: 促销活动规则 2.1 有效期
      # 售后FAQ 里就有一条【问的就是这句话】的问答对
      - text: 不能，过期自动失效不予补发，请在有效期内使用
        doc_hint: 售后FAQ「优惠券过期了能补吗」
      # ⚠️ 未采用：160（退款到账时间说明 > 附加条件「已过期的优惠券不予返还」）
      #    它回答的是「退货时过期券退不退」，不是「过期了该怎么办」。相关 ≠ 回答

  - question_no: B-011
    question: 价格保护怎么申请
    category: keyword
    difficulty: 2
    intent: PRICE_PROTECTION
    # ★★ 这道题是【意图定向检索的压力测试】，故意保留。
    #   它的正解横跨三种 doc_type：促销活动规则(3) + 价格保护政策(2) + 售后FAQ(4)，
    #   无论路由到「促销活动」还是「售后服务」，只要 5.4 做硬过滤就必然切掉一部分。
    #   它不是树的缺陷 —— 是语料的真实形态（同一条规则被写在三份文档里）。
    #   5.4 怎么处理它，决定了「只对窄类型过滤」到底够不够。
    expected_answer: 下单之日起 15 天内同平台降价可申请退差价；需提供降价截图，每笔订单仅可申请一次。
    # ★★ 这道题原来只标了 109，而 109 是「附加条件」不是「申请方式」——
    #    标错了。真正的答案在另外两个文档里，重排把它们提上来时
    #    被记成了「重排导致 MRR 下降」。这是本次修订的起因
    anchors:
      - text: 系统会自动比对该商品当前价格，符合条件的即时退还差价至原支付账户
        doc_hint: 促销活动规则 4.3 申请方式
      - text: 在订单页面点击「申请价保」，系统自动比价，符合条件即时退差价
        doc_hint: 售后FAQ「价保怎么申请」
      - text: 需提供降价截图；每笔订单仅可申请一次价格保护
        doc_hint: 价格保护政策 附加条件（申请时的材料与次数限制，也算答案的一部分）
      # ⚠️ 未采用：108 / 11（保价范围）、29（哪些不支持价保）
      #    它们回答的是「能不能保」，不是「怎么申请」

  - question_no: B-012
    question: 满减活动能和优惠券一起用吗
    category: keyword
    difficulty: 2
    intent: COUPON
    # ★ 标 COUPON 而不是 FULL_REDUCTION，判据是【问题在问什么】：
    #   它问的是「券和满减的叠加关系」，而售后FAQ 把这条答案归在自己的
    #   「优惠券可以叠加吗」条目下 —— 语料的归类也是这么看的。
    #   doc_types 上：COUPON 声明 {3,4}，本题 gold 是 {3,4} ✓；
    #   若标成 FULL_REDUCTION（声明 {3,4}）也能通过，但语义上偏了。
    expected_answer: 可以，满减活动可与店铺优惠券叠加，但不与同类满减活动叠加。
    anchors:
      - text: 满减活动可以与店铺优惠券叠加使用，但不与同类满减活动叠加
        doc_hint: 促销活动规则 1.3 叠加规则
      - text: 满减活动可以和店铺券叠加，但同类满减活动之间不能叠加
        doc_hint: 售后FAQ「优惠券可以叠加吗」

  # ---------- 发票 / 退款 / 换新 / 物流（4 题）----------
  - question_no: B-013
    question: 发票能开纸质的吗
    category: keyword
    difficulty: 1
    intent: RULES_AND_PROCESS
    expected_answer: 平台默认开具电子发票，可在订单详情页下载；需要纸质发票请在下单时备注。
    # ★ 这道题【故意保持单答案】，它是「补 gold 不能拿系统输出当依据」的反例。
    #   重排把 30（售后FAQ「可以开【电子】发票吗 | 可以，下单时可选择电子发票」）
    #   提到了 110 前面，MRR 因此下降 —— 而 30 回答的是【电子发票】，
    #   问题问的是【纸质发票】。重排在这道题上是【真的错了】，
    #   gold 不应该为它辩护。
    anchors:
      - text: 平台默认开具电子发票，可在订单详情页下载。如需纸质发票，请在下单时备注
        doc_hint: 发票与保修凭证说明
      # ⚠️ 未采用：30（电子发票）、31（发票开错了能重开吗）、111（抬头与退回）
      #    都不回答「能不能开纸质发票」

  - question_no: B-014
    question: 退款什么时候到账
