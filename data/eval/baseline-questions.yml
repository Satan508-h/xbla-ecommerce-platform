        doc_hint: 退款到账时间说明
      - text: 原路退回。余额支付实时到账，银行卡支付三到十五个工作日
        doc_hint: 售后FAQ（同一条规则的另一种表述）
      - text: 商品退回并经平台验收合格后，退款将在三个工作日内发起
        doc_hint: 售后政策汇编 2.3

  - question_no: B-015
    question: 以旧换新的旧机估价有效期多久
    category: keyword
    difficulty: 2
    intent: TRADE_IN
    expected_answer: 旧机估价在下单后 7 天内有效，逾期需重新估价。
