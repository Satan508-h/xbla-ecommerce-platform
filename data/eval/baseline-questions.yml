    anchors:
      - text: 平板电脑适合记笔记和看课件，建议选支持手写笔的型号
        doc_hint: 商品导购指南

  - question_no: B-020
    question: 笔记本处理器后缀 U 和 H 有什么区别
    category: keyword
    difficulty: 2
    expected_answer: U/P 是轻薄本处理器，H 是标压处理器；H 性能更强但更耗电。
    anchors:
      - text: H 系列性能更强但更耗电，如果你主要在家或办公室使用
        doc_hint: 商品导购指南
