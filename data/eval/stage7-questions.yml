  # ============================================================
  # 九、非业务分支（13 题）· 全部 expect_no_retrieval: true
  #
  #   ★★ 两个分支**语义差别很大**（意图树的原话）：
  #      OUT_OF_SCOPE  不是我的业务     → 「我只处理商品导购与售后问题」
  #      CLARIFY       是我的业务，但没说清 → 「你指的是哪款商品？」
  #   混起来的后果用户直接感受得到：问「那个怎么样」时收到
  #   「我只处理商品导购与售后问题」—— 而那句话明明就是在问商品。
  #
  #   ★★ 但两者的**代码路径不同**，这是本批最需要注意的一件事：
  #      CLARIFY   → **短路**：不检索、不调模型，所以 provider / cost /
  #                  references / retrieval_detail **全是 NULL**
  #                  —— 那是「没有发生」的诚实表达（ADR-041）
  #      OUT_OF_SCOPE → 树里标的是 retrieval: NONE，但**代码只对 CLARIFY 短路**
  #                  —— 它仍然走检索 + 生成。★ 这是**已知的不一致**，
  #                  写在 docs/05 §9.3 ⑩。所以兜底题的行里**会有**
  #                  retrieval_detail，而那不是 bug。
  #   ⚠️ 报告里这两种「空」必须分开解释：
  #      「字段为 NULL（澄清短路）」≠「检索跑了但没召回」——
  #      序列化出来本来长得一样，靠 intent 与 status 区分（ADR-041）。
  #
  #   ★★ 判据（两类各自的「对」）：
  #      兜底 → 简短说明服务范围 + 给可以问的方向；**不得**给出任何业务答案
  #      澄清 → 反问**一个**最关键的信息（型号/场景/想问什么）；不罗列一堆问题
  #
  #   ------------------------------------------------------------
  #   ★★★ 本片写完后被少样本护栏**整片拦下**（10 条逐字重合），
  #   而这不是疏忽 —— 它是一条关于这两个分支的**结构性事实**：
  #
  #     少样本 OUT_OF_SCOPE 的 4 句 = 你好 / 今天天气怎么样 / 帮我写一首诗 / 你是谁开发的
  #     少样本 NEEDS_CLARIFICATION 的 6 句 = 那个怎么样 / 它呢 / 这个可以吗 /
  #                                        还有别的吗 / 多少钱 / 我想问一下
  #     ★ 后一组**与意图树里 examples 的写法逐字一致**。
  #
  #   也就是说：这两个分支的语义空间本来就由**极短的指代句与寒暄句**
  #   构成，而少样本必须用最典型的句子 —— 于是**最自然的问法被占光了**，
  #   剩下能写的只有「同义改述」。
  #
  #   ★ 所以本片 13 道题里有 10 道改过题面，改法是**换一个真实但不同的说法**
  #   （在吗 / 明天会下雨吗 / 写一篇八百字的作文 / 你是哪个公司做的 /
  #     它值得买吗 / 这个好不好用 / 它多少钱来着 / 还有没有别的选择 /
  #     这样能行吗 / 再详细说说），并把每一处改动**写进那道题的 notes**。
  #
  #   ★★ 报告必须写明这件事，因为它影响**指标怎么读**：
  #     ① 这两桶的意图准确率**天生偏高**（少样本刚教过同类句子），
  #        而题面越像少样本，偏得越多 —— 本批已经把「像」压到最低；
  #     ② 想真正测这两个分支的泛化，只能靠**没被教过的说法**，
  #        而那种说法的数量是有限的（这也是它们只占 13/159 的原因之一）；
  #     ③ ⚠️ 若将来往少样本里补句子，**必须同时检查题库** ——
  #        否则新样本可能正好把某道评测题变成「照抄题」，
  #        而这次的护栏（IntentFewShotTest）会当场报出来。
  #
  #   ⚠️ 本批刻意**没写**的一类题（需要你拍板）：意图树把
  #   「这个怎么退货」「这个多久发货」判给了**业务叶子**（判据是
  #   「去掉指代词之后还能不能回答」）。它们是最硬的意图边界样本，
  #   但不属于澄清桶 —— 写进 RETURN_EXCHANGE / RULES_AND_PROCESS
  #   会让那两个叶子的权重超配。★ 要写就得先定：加题，还是不加。
  # ============================================================

