  # 5.2 满减与秒杀 FULL_REDUCTION（10 题）   doc_types [3,4]
  #
  #   ★ 满减 6 题 + 秒杀 4 题。两半的**答案形状完全不同**：
  #   满减的答案是**公式与门槛**（算出来的），秒杀的答案是**时点与名额**
  #   （到点抢的）—— 前者考验「能不能算对」，后者考验「能不能说准时点」。
  #   ★ FR-003 是本片最值钱的一道：券抵扣的部分**不计入满减门槛**，
  #   所以「用券」和「凑满减」会互相削弱 —— 这一条几乎所有人都会答错。
  # ------------------------------------------------------------

  - question_no: FR-001
    question: 满减是怎么算的
    category: colloquial
    difficulty: 1
    intent: FULL_REDUCTION
    expected_answer: 订单金额达到指定门槛后直接减免固定金额。
    notes: |
      ★ 本片基准题：如果它都召回失败，问题不在重排也不在过滤。
      ⚠️ 语料里给出定义的正是「满 3000 减 300」那句例子，
      但**锚点不能选整句** —— 它在原文里是跨行的
      （「…达到 3000 元时，\n结算金额自动减去 300 元。」），
      跨行锚点会匹配不上（LIKE 是逐字节的，而换行符也在其中）。
      ★ 这是个只会在「锚点写得太贪心」时才犯的错，记在这里省一次排查。
    anchors:
      - text: 满减活动指订单金额达到指定门槛后直接减免固定金额
        doc_hint: 促销活动规则 1.1 活动形式

  - question_no: FR-002
    question: 满减门槛算不算运费
    category: keyword
    difficulty: 2
    intent: FULL_REDUCTION
    expected_answer: 不算。门槛按商品实付金额计算，不含运费。
    notes: |
      ★ 关键词型、一问一答，但它引出的下一题（FR-003）才是真正的坑。
      ★ 语料在这一句里同时排除两样东西：**运费**和**已使用的优惠券抵扣部分** ——
      用户几乎只会问其中一样，而完整答案要两句都说。
    anchors:
      - text: 门槛金额按**商品实付金额**计算，不含运费、不含已使用的优惠券抵扣部分
        doc_hint: 促销活动规则 1.2 门槛计算规则

  - question_no: FR-003
    question: 用了优惠券之后还能凑满减吗
    category: colloquial
    difficulty: 3
    intent: FULL_REDUCTION
    expected_answer: 要按扣掉券之后的实付金额去凑。例：3200 元的商品用掉 200 元券，参与满减的金额是 3000 元。
    notes: |
      ★★ 本片最值钱的一道，也是全集里**最反直觉**的一条：
      券抵扣的部分**不计入满减门槛**。所以「用券」和「凑满减」会互相削弱
      —— 用券用得越多，越凑不到门槛。
      ★ 语料用了一个具体的数算给你看（3200 用 200 券 → 3000 刚好达门槛），
      而这正是「散文里夹着算例」的价值：光看规则句容易读反。
      ★ 它与 FR-002 同片（#3），但问的是**同一句话里后半个排除项**：
      FR-002 问运费（容易），这题问券（难）。两题并列，
      报告才看得出「同一片切片的两个细节，召回难度差多少」。
    anchors:
      - text: 那么参与满减计算的金额是 3000 元，刚好达到门槛
        doc_hint: 促销活动规则 1.2 门槛计算规则

  - question_no: FR-004
