  # ------------------------------------------------------------
  # 6.2 使用操作 USAGE_GUIDE（8 题）   doc_types [5]
  #
  #   ★★ doc_types 只有 [5] —— 这是树里**唯一**一个单 doc_type 的
  #   知识型叶子（另一个是 MEMBERSHIP 的 [4]）。
  #   而语料里 doc_type=5 的文档**只有一份**：星辰X1 的说明书，
  #   切出 5 片。所以这 8 道题全部落在这 5 片里 —— 这是语料的形状。
  #
  #   ★ 好在说明书那 5 片不是同一件事的五种说法，而是五件不同的事：
  #     产品简介 / 外观与按键 / 开机与初始化 / 充电与电池 / 常见问题
  #   8 道题覆盖了其中 3 片（开机 #64、充电 #67、常见问题 #70），
  #   另有 2 片（产品简介、外观与按键）落在 SPEC_QUERY 里
  #   —— 同一份文档按问题性质分给两个叶子，这是「叶子 ≠ 文档」的实例。
  #
  #   ★★ 本片最后两题（UG-006 / UG-007 / UG-008 中的两道）是
  #   **从批次 2（保修）挪过来的**：它们本来是最自然的保修题
  #   （「充不进电怎么办」），但意图树里 USAGE_GUIDE 与 WARRANTY
  #   **都声明了「常见故障」**，标给谁都能在树里找到依据 ——
  #   拿它算 Top-1 准确率是掷硬币。★ 处理方式是把它们写在这里，
  #   并把这条重叠**写进报告**（修法：从 WARRANTY 的描述里删掉
  #   「常见故障怎么处理」，或从 USAGE_GUIDE 删掉「常见故障的排查步骤」）。
  # ------------------------------------------------------------

