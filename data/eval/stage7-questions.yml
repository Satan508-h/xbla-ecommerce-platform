  # ============================================================
  # 五、促销活动 PROMOTION（40 题）
  #
  #   五片叶子：优惠券 12 / 满减与秒杀 10 / 会员 3 / 价格保护 10 / 以旧换新 5
  #
  #   ★★ 两处**从配额上就看得出来的语料事实**（报告要点名）：
  #
  #     ① 会员权益在**全库里只有一片切片**（售后FAQ #34，21 个字：
  #        「等级越高享受的折扣力度越大，钻石会员可享受专属客服」）。
  #        树给了它 5 道题的名额，而语料撑不起 —— 硬写 5 道只会得到
  #        5 道近义反复题，让 MEMBERSHIP 在汇总指标里被过度加权。
  #        → 这里只写 3 道，**缺的 2 道挪给了价格保护**（那一片反而更厚）。
  #        ⚠️ 这是对第四批既定分布的一次**有意偏离**，理由写在 MB-001 的注释里。
  #
  #     ② 树的 MEMBERSHIP examples 里有两句在语料里**查无答案**：
  #        「怎么成为钻石会员」（没有升级规则）
  #        「会员折扣能和优惠券一起用吗」（没有叠加规则）
  #        ★ 例子的作用是给模型看「这类话属于这个意图」，所以它们本身
  #        不必有答案 —— 但**报告必须说明**：这两句问出来系统答不了，
  #        而那不是检索失败，是语料里没有这件事。
  #
  #   ★★★ 本片最要紧的一条语料事实（PP-002 的题面就是冲它去的）：
  #     价格保护的**起算点**在两份文档里不一样 ——
  #       促销活动规则 4.1  「自营商品在**签收后**十五天内」
  #       价格保护政策      「商品**自下单之日起** 15 天内」
  #     下单到签收之间隔着物流，两个口径能差好几天。
  #     这不是措辞差异（像 W-004 那样），是**同一件事的两个不同答案**。
  # ============================================================

  # ------------------------------------------------------------
  # 5.1 优惠券 COUPON（12 题）   doc_types [3,4]
  #
  #   ★ 12 道题挤在 4 片切片上（#5 #6 #7 #25 #26），但**不是重复**：
  #   #6 一片里就写着四条互不相干的规则（限用一张 / 不可拆分 /
  #   不可兑现 / 不可转赠），每一条都是一个独立的事实。
  #   ★ 这一片也是「FAQ 天然跨业务域」最集中的地方 —— 券的规则
  #   一半在促销规则里、一半在售后FAQ 里，两处的说法还不完全一致
  #   （见 C-011）。
  # ------------------------------------------------------------

