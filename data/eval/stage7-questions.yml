  # ------------------------------------------------------------
  # 9.2 信息不足 NEEDS_CLARIFICATION（6 题）
  #
  #   ★ 判据（意图树原文）：**「这句话【单独拿出来】能不能回答」** ——
  #   不是「句子长不长」，也不是「有没有『这个』『那个』」。
  #   ★ 6 道题覆盖五种「不足」：
  #     指代不明（那个怎么样 / 它呢）· 缺主语（多少钱）· 无上下文（还有别的吗）
  #     · 确认型（这个可以吗）· 只说开场白（我想问一下）
  #   ★ 这一档的正确答案有个**硬指标**：它必须**短路** ——
  #   provider / cost / references / retrieval_detail 全为 NULL。
  #   判据不该是「回答里有没有反问句」（措辞会骗人），
  #   而该是**那几个字段空不空**（ADR-041）。
  # ------------------------------------------------------------

  - question_no: NC-001
    question: 它值得买吗
    category: colloquial
    difficulty: 2
    intent: NEEDS_CLARIFICATION
    expect_no_retrieval: true
    expected_answer: 反问用户指的是哪款商品。
    notes: |
      ★★ 意图树里 CLARIFY 那一段的说明，就是为这一类句子写的：
      「在没有这个选项时，分类器对『那个怎么样』给出的是一个
      **自信的** OUT_OF_SCOPE」—— 而那句反问是错的，因为它明明在问商品。
      ★ 它是本片里最值钱的一题：它检验的是 5.3 那次修正有没有生效。
      判成 OUT_OF_SCOPE 的话，用户会收到「我只处理商品导购与售后问题」。
      ⚠️ 判据：intent 必须是 NEEDS_CLARIFICATION，且那一行**没有**
      retrieval_detail（短路）。
      ★★ 题面改过一次（原为「那个怎么样」，与少样本逐字相同，见本片说明）。
      ★ 改成「值得买吗」之后反而更硬：它把问题引向**建议**
      （PURCHASE_ADVICE 那一档），而正确行为是**不猜商品就反问** ——
      「不猜」比「猜到 SCENARIO_PICK 上」难。
    anchors: []

