  # ============================================================
  # 三、保修维修 WARRANTY（9 题）
  #
  #   ★ 这一片的语料形状和前两片不同：保修年限**只写在两个地方**
  #   （政策汇编 3.2 + 售后FAQ），而六个品类规则里只有电脑类把它重写了一遍。
  #   所以这里 gold 的重心是「通用政策 × 品类条款」两层，
  #   而不是「同一件事被多份文档各写一遍」。
  #
  #   ------------------------------------------------------------
  #   ★★ 刻意【没有】写「充不进电怎么办 / 充电变慢是不是坏了」这两道
  #      —— 它们本该是最自然的保修题，但意图树在这两句话上自己打架：
  #
  #        USAGE_GUIDE（商品咨询）  描述里写「以及常见故障的排查步骤」
  #        WARRANTY（售后服务）     描述里写「常见故障怎么处理」
  #
  #      两片叶子都声明了「故障」，而它们 doc_types 不同（[5] vs [2,4,5]）。
  #      换句话说：**无论模型答哪一个，都能在树里找到依据** ——
  #      拿这种题去算 Top-1 意图准确率，测的是掷硬币。
  #
  #      ★ 处理方式：这两道题留到第 4 批的 USAGE_GUIDE 里写，
  #      并把这条重叠**写进报告**。修法有两种 —— 从 WARRANTY 的描述里
  #      删掉「常见故障怎么处理」，或从 USAGE_GUIDE 删掉「常见故障的排查步骤」——
  #      那是个需要拍板的决定，不该在写题时顺手改掉。
  # ============================================================

  - question_no: W-001
    question: 手机是不是只保修一年
    category: colloquial
    difficulty: 1
    intent: WARRANTY
    expected_answer: 不止一年。整机保修一年，主要部件保修两年；保修期自签收之日起计算。
    notes: |
      ★★ 这道题的题面改过一次，原因值得记下来：
      原来写的是「手机保修几年」，结果 `IntentFewShotTest` 当场报红 ——
      **它与 `data/agent/intent-fewshot.yml` 里 WARRANTY 的样本逐字相同**。
      那条护栏（ADR-036）守的是：少样本会进分类 prompt 的前缀，
      题目与它重合时，意图准确率测的是「能不能照抄刚看过的句子」。
      ★ 修法选的是**改评测题**，不是改少样本 —— 少样本是阶段 5 的冻结产物，
      动它等于动 5.2 的 95% 基线；而题库本来就该避开 prompt 里已有的问法。
      ★★ 顺带暴露了一个结构性事实：**少样本把每个意图最自然的那几种问法
      都用掉了**（WARRANTY 那四条是「手机保修几年 / 屏幕摔碎了保修吗 /
      这个保修多久 / 保修要寄到哪里去」）。所以阶段 7 的口语题只能比它们
      更难 —— 这恰好是 docs/06 §3.3 想要的（重排的收益集中在口语句上）。
      ⚠️ 这条要写进报告的「已知局限」：题库里凡与少样本同主题的题，
      都有轻微的同源优势。
      ★ 改成「只保修一年」之后，题目多了一层价值：用户带着**误解**来问，
      正确答案必须纠正它（不是「一年」而是「整机一年、主要部件两年」）——
      答成「是的，一年」的模型检索没错、回答错了。W-002 是它的品类对照。
      ------------------------------------------------
      ★ gold 的形状：答案是**两片**，且两片的写法完全不同 ——
        售后政策汇编 3.2 是散文（「整机一年、主要部件两年」）
        售后FAQ 是表格行（「手机笔记本整机一年主要部件两年」）
      ★ 手机类商品售后规则（#101）**刻意不在 gold 里**：它讲了 7 天退货、
      15 天换货、30 天维修，唯独没写保修年限 —— 它对「保修几年」是一个
      **看似相关、实则不回答**的切片。这种切片是召回噪声的主要来源，
      也正是这题值得留着的原因（它测的是「能不能不召回它」）。
      被否决：把 #101 标进 gold（理由是它提到了「维修」）——
      那会把「召回了但不回答问题的切片」也记成命中。
    anchors:
