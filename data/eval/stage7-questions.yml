  # ============================================================
  # 八、订单物流 ORDER_LOGISTICS（15 题）   doc_types []   retrieval: TOOL
  #
  #   ★★★ 这一批与前 131 道题有**结构性的不同**：28 道题**全部没有 gold**。
  #   它们的正确答案不在知识库里 —— 所以它们
  #     · 不进 HitRate / Recall / MRR 的分母（空 gold 题单独一桶）
  #     · 也不进 RAGAS（contexts 为空，四个指标全都算不了）
  #   报告里这三桶（工具 15 / 兜底 7 / 澄清 6）各自看的是**别的**东西：
  #     工具题 → 工具有没有被正确调用 + 回答是否忠实于工具返回
  #     兜底题 → 该拒绝时有没有拒绝（不编造业务答案）
  #     澄清题 → 有没有短路（不检索不调模型，反问一句）
  #   ★ 每个题的 `expected_answer` 在这一批里**只给人看**（人工复核用），
  #     不参与任何自动打分 —— 因为工具题的标准答案来自**活的数据**。
  #
  #   ------------------------------------------------------------
  #   ★★★ 为什么 15 道工具题**每一道**都要 user_id
  #
  #   因为 `ToolLoop` 在 userId 为 null 时**短路不调模型**（见
  #   `ToolLoop.java` 里那句「没有身份：不调模型，直接回一句实话」）——
  #   身份缺席时整条工具路径被跳过，用户拿到的是 noIdentityText。
  #   ★ 也就是说：题库里漏写 user_id 的后果不是报错，而是
  #   **15 道题全线失败，而报告上看起来像「模型不会用工具」**。
  #   这正是 R8 要堵的那个洞（见 docs/10 的风险表）。
  #   ★ 身份由跑题器写进 `X-Xbla-User-Id` 头 —— **不是工具参数**
  #   （ADR-054：工具参数是模型填的，那就成了模型可控的越权入口）。
  #
  #   ------------------------------------------------------------
  #   ★★ 本批写题时查出的 seed 数据一致性问题（报告要点名）：
  #   **10 笔已取消订单，全部带着「取消时间早于发货时间」的物流信息**
  #   （实测：`cancelled_at < shipped_at` 的订单数 = 已取消订单总数 = 10）。
  #   ★ TO-004 就是冲它去的：工具会把「已取消」和「京东物流 SF0000…」
  #   一起返回，模型必须读 `status_text` 而不是拿物流单号讲故事 ——
  #   一个只抓物流字段的模型会回答「您的包裹正在运输中」，
  #   而那笔订单早就取消了。
  #
  #   ⚠️ 一个产品事实（也要进报告）：`query_order_status` **需要订单号**，
  #   而这个平台**没有「列出我的订单」的工具** —— 所以「我的订单到哪了」
  #   这类问题的正确行为是**反问订单号**，不是编一个状态出来。
  #   这是工具集的能力边界，不是模型的问题。
  # ============================================================

  # ------------------------------------------------------------
  # 8.1 订单状态 ORDER_STATUS（6 题）· user_id: 8
  #
  #   ★ 这 6 道题覆盖工具返回的**四种形态**：
  #     正常（待发货 / 已发货 / 已取消）· 查无此单 · 不属于当前账号 · 没给订单号
  #   ★ 后三种才是这一批的重点：它们测的是**诚实**，不是查询能力。
  # ------------------------------------------------------------

  - question_no: TO-001
