      「可以叠券」和「不叠同类满减」是两个独立的结论，
      分成两题之后，模型答对一半的情况就能被指标分辨出来
      —— 混在一题里时，答对一半和答对全部都算「答对了」。
      ★ 这是本批「一题一事实」原则最直接的体现。
    anchors:
      - text: 满减活动可以与店铺优惠券叠加使用，但不与同类满减活动叠加
