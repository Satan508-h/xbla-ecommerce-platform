    expected_answer: 可以和店铺优惠券叠加，但不与同类满减活动叠加。
    notes: |
      ★★ C-009 的**镜像**（见那题的注释）：同一件事、反过来的主语。
      语料的回答在同一个句子里装了两件事 ——「能叠券」和「不能叠满减」——
      只答前半句会漏掉后半句，而用户问的正是「能不能一起用」。
      ⚠️ 保留这一对是有代价的：它们必然产生「答对但意图判错」的样本。
      报告里要把这两题的混淆矩阵单列 —— 如果模型在这两题上
      来回摇摆，那是**树的分界不够硬**，不是模型不行，
      而两种原因的修法完全不同（一个改 prompt，一个改树的措辞）。
    anchors:
      - text: 满减活动可以与店铺优惠券叠加使用，但不与同类满减活动叠加
