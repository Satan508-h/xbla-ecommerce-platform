# ============================================================
# 阶段 7 评测集 —— 单轮题（7.1 的主体）
#
# ★ 构造方式：**读语料、按用户口吻手写**。
#
#   和 baseline-questions.yml（阶段 4 那 20 题）的差别不是「更认真」，
#   是**顺序**：
#
#     反向构造（阶段 4）  先看一片切片 → 就着它写一个问题
#                        ✗ 用词天然贴近原文，比真实提问简单
#                        ✗ 看了一片就以为它是唯一答案（docs/06 §2.2 偏差 A/B）
#     本题集            先通读一片语料 → 想「用户会怎么问这件事」→ 再找锚点
#                        ✓ 问法不向原文靠拢
#                        ✓ 一个事实可以出多道题（不同形态、不同侧面）
#
#   ⚠️ 但**偏差没有消失，只是换了一种**，报告里必须写清：
#      · 标注者是 Claude（不是真人用户），审核是用户抽查
#      · 语料是仿真生成的，「用户会怎么问」仍然是想出来的，不是采集来的
#      · 题还是从语料里长出来的 —— 所以它测的是「语料里有的东西能不能被找到」，
#        不是「真实用户的分布长什么样」
#
# ------------------------------------------------------------
# ★★ 写题纪律（对应 docs/06 §2.2.1 的镜像，比上面那些声明更要紧）
#
#   写题期间【不跑检索】。全部写完、reload 通过之后，才跑第一次评测。
#
#   理由：如果边写边看「这道题能不能召回」，就会不自觉地改问法、
#   换锚点 —— 那和「因为重排把它提上来了就补进 gold」是同一个错误
#   （ADR-029），只是方向相反。评测从此不描述任何东西，
#   而它看起来完全正常。
#
#   ★ 允许的：查锚点在不在库里（那是**机械检查**，加载器自己也会做）。
#   ✗ 不允许的：看这道题召回了什么、排第几。
#
# ------------------------------------------------------------
# ★ 字段
#
#   question_no    唯一（跨全部题库文件）
#   category       查询形态：keyword 词典型 / model 型号型 / colloquial 口语句
#                  ★ 口语题必须占多数（docs/06 §3.3 实测：重排的收益
#                    几乎全部集中在口语句上，口语题不够就测不出它值不值）
#   difficulty     1 易 / 2 中 / 3 难
#   intent         ★ 意图树的【叶子】code，必填
#   expected_answer 一句话标准答案 —— 只给 RAGAS 的 context_recall 用
#                  （检索类指标用的是 anchors 解析出的 chunk id，不是它）
#   anchors        锚点 = 该切片里独有的一段原文，加载时反查 chunk id
#                  ⚠️ 命中 0 条或 >1 条都会【直接抛异常】
#   notes          为什么这么标。**包括被否决的候选及原因** —— 不写下来，
#                  下一个人分不清某个候选是「被考虑过并否决」还是「被漏了」
#
# ------------------------------------------------------------
# ★★ 2026-09-20 同源度清理（阶段 7 批次 6 之后统一做的一次）
#
#   背景：写题时只防了【逐字重合】（IntentFewShotTest 结构性强制），
#         没防【近似】。事后拿字符二元组 Jaccard 通扫了三套题库 × 59 条少样本，
#         发现单轮这套有 5 句 ≥0.35，其中两句的最近邻是【同叶子】的样本 ——
#         那意味着分类器被 prompt 直接带向正确答案，而数字上看不出来。
#
#   改了 5 道（只改题面，**不动 anchors** —— 新问法仍由同一批切片回答）：
#
#     MB-001  会员等级越高有什么好处  0.45 → 会员等级是干什么用的       0.15
#     MB-002  钻石会员有什么特别的    0.36 → 钻石会员比普通会员多了什么  0.19
#     NC-003  它多少钱来着          0.40 → 我看的那个标价多少          0.11
#     NC-004  还有没有别的选择        0.38 → 只能选这些吗              0.00
#     P-009   收到货发现坏了怎么办     0.38 → 拆开包装发现是坏的          0.00
#
#   ⚠️ MEMBERSHIP 那两句要单独说明：它的【全部语料就是一句话】
#   （售后FAQ「等级越高享受的折扣力度越大，钻石会员可享受专属客服」），
#   而少样本里那条「会员有什么好处」几乎就是这句话最自然的问法 ——
#   ★ 任何 MEMBERSHIP 的题都会贴近它，这不是出题没出好，是那个叶子
#     的语料太薄。改到 0.15 / 0.19 已经是这类句子的下限。
#   ★★ 所以 MEMBERSHIP 的逐叶子准确率**不作为结论**（n=3，见下方配额说明）。
#
#   ⚠️ 还有一处护栏够不着的地方，同一天查出来的：
#   B-009「优惠券怎么用」和 B-016「收到货发现损坏怎么办」（baseline 那套）
#   逐字出现在 intent-tree.yml 的 description 里 —— 而 description
#   **会进分类 prompt**（IntentPromptBuilder:81）。也就是说那两道题的答案
#   被 prompt 递到手上了，而当时没有任何测试会报错。
#   两道题已改写（→「券领了之后怎么用」「签收时发现商品破损怎么办」），
#   护栏也补上了（见 IntentFewShotTest 的 promptLeak 一节）。
#
# ------------------------------------------------------------
# ★ 配额说明（2026-09-20 定稿，与计划的两处偏差已被接受）
#
#   MEMBERSHIP        5 → 3    语料只有 1 片切片，3 道题已把那句话问完
#   PURCHASE_TIMING   8 → 6    语料只有 2 片，6 道题里 4 道锚在同一片
#   SPEC_QUERY       18 → 20   补的 2 个名额 —— 它是最欠采样的叶子
#                              （1555 片商品详情 / 20 道题 ≈ 一片 78 道题）
#   PRICE_PROTECTION  8 → 10   同上
#
#   ★ 计划的分布是【读语料之前】定的估值；语料是「有多少东西可问」的唯一事实来源。
#   ★★ 报告里的逐叶子数字**必须带 n**；**n < 5 的不作为结论**
#      （MEMBERSHIP n=3 → 一道题翻转就是 33 个百分点）。
#      印出来，但标注「不作为结论」—— 不允许直接引用。
# ============================================================

# ★ 阶段 9.6 起，这个目录里每个 *.yml 都要先自报家门：
#   kind: bank = 题库（还要 question_set / source / annotated_by）
#   kind: gold = 判据/标注文件，不进任何指标
#   ⚠️ 不写 kind 会【当场报错】，没有「默认是题库」这回事 ——
#      成因是 9.5 的 recommend-gold.yml 让每一次 reload 都失败，
#      而报错内容指向的修法是错的。见 EvalQuestionLoader#KIND_BANK
kind: bank
question_set: stage7
source: corpus_driven_manual
annotated_by: Claude 读语料手写；用户抽查

questions:

  # ============================================================
  # 一、退换货 RETURN_EXCHANGE（15 题）
  #
  #   这一片是语料里【最厚】的售后内容：一份 67 条的售后语料里，
  #   退换货横跨「七天无理由政策 / 六个品类的差异化规则 / 退换货流程」
  #   三个地方 —— 所以大量题目的 gold 是**跨文档**的，这正是要测的东西。
  # ============================================================

  - question_no: R-001
    question: 包装盒扔了还能退货吗
    category: colloquial
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 不能。七天无理由要求原包装完整（拆封但未损坏包装的视为包装完整）；大家电无原包装的需支付包装费。
    notes: |
      ★ 问的是「包装」这个最容易被忽略的门槛，而不是「能不能退」。
      语料里它出现在两处，且是两种不同的后果：
        七天无理由政策 2.1 —— 原包装完整是「商品完好」的必要条件（硬门槛）
        大家电售后规则 附加条件 —— 无原包装【能退】但要付包装费（软门槛）
      → 两道都标进 gold，因为「扔了包装盒」这件事在两个语境下答案不同，
        而这正是用户会遇到的困惑。
      被否决：只标 2.1 —— 那会让「大家电可以退但收费」这条答案被判成误召回。
    anchors:
      - text: 拆封但未损坏包装的视为包装完整
        doc_hint: 售后政策汇编 2.1 适用条件
      - text: 无原包装的需支付包装费
        doc_hint: 大家电售后规则 附加条件

  - question_no: R-002
    question: 七天无理由是从哪天开始算的
    category: colloquial
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 自签收之日起七天内，七天为自然日，签收当日不计入。
    notes: |
      低难度题，但它是「口语问法 + 精确答案」的典型：
      用户不会说「自然日」，问的是「从哪天算」。
      ★ 刻意不把「自签收之日起七天内」这句写进锚点 —— 那句在多个品类规则里
      重复出现（手机/平板/电脑/耳机/智能穿戴/大家电都有），锚点不唯一。
      选的这句「签收当日不计入」才是政策里独有的那句。
    anchors:
      - text: 七天为自然日，签收当日不计入
        doc_hint: 售后政策汇编 2.1 适用条件

  - question_no: R-003
    question: 定制的商品能退吗
    category: colloquial
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 不能。消费者定作的商品不适用七天无理由退货。
    notes: |
      ★ 这是一个**法律常识题**（《消费者权益保护法》第 25 条的法定除外项），
      语料里的写法与法条一致，所以「模型靠常识答对」的概率很高。
      留着它的理由是：它测的不是模型懂不懂法，而是**系统会不会给出
      语料里的那一句**。★ 同时也是 R-004 的对照组 ——
      同样问「能不能退」，一个是法定除外、一个是平台自定的激活条款。
    anchors:
      - text: 消费者定作的商品
        doc_hint: 售后政策汇编 2.2 不适用无理由退货的商品

  - question_no: R-004
    question: 手机激活了还能退吗
    category: colloquial
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 不支持无理由退货；但若存在质量问题，凭厂商检测报告可在 15 天内换货、30 天内维修。
    notes: |
      ★★ 这题的 gold 跨三处，且**三处的说法不完全一样**：
        政策汇编 2.2 —— 数码产品激活即视为价值贬损较大，不支持无理由退货，
                        但支持因质量问题产生的退换货
        手机类商品规则 附加条件 —— 一经激活即绑定保修，非质量问题不支持退货
        （另有 七天无理由政策 附加条件 —— 「手机、电脑等数码产品拆封激活后不支持」）
      三条都是答案，都标进去。
      ★ 关键在于「但若存在质量问题…凭检测报告 15 换 30 修」——
      用户的真实困惑往往是「激活了是不是就彻底没救了」，
      而这条给出了例外。**答不出来的回答会把用户吓退**。
    anchors:
      - text: 一旦激活（开机并完成初始化设置）即视为价值贬损较大
        doc_hint: 售后政策汇编 2.2
      - text: 凭厂商检测报告可在 15 天内换货、30 天内维修
        doc_hint: 手机类商品售后规则
      - text: 手机、电脑等数码产品拆封激活后不支持无理由退货
        doc_hint: 七天无理由退货政策 附加条件

  - question_no: R-005
    question: 大家电退货要自己出运费吗
    category: colloquial
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 无理由退货需自行承担往返运费，单件最高 300 元；已安装的还需支付拆机费。
    notes: |
      ★ 「单件最高 300 元」是一个**有上限的收费**，而用户通常以为
      「退货要么免费要么按实际运费」—— 上限这个细节只有语料里有。
      被否决：把「大家电自签收之日起 7 天内支持无理由退货」也标进来 ——
      它讲的是时限，没有回答「运费谁出」，属于「相关 ≠ 回答」（docs/06 §2.2.1）。
    anchors:
      - text: 需自行承担往返运费（单件最高 300 元）
        doc_hint: 大家电售后规则
      - text: 已安装的大家电退货需支付拆机费
        doc_hint: 大家电售后规则 附加条件

  - question_no: R-006
    question: 大家电多少天内可以换货
    category: keyword
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 30 天。大家电自签收之日起 7 天内可退货、30 天内可换货。
    notes: |
      ★★ 这题是**品类差异**的探针：语料里 6 个品类的规则长得几乎一样，
      只有大家电的换货时限是 30 天，其余都是 15 天。
      所以「把 30 天答成 15 天」是这类问题最可能的错法，
      而它来自**隔壁品类的切片被召回了**。
      ⚠️ 锚点选「可换货天数：30 天」而不是「- 可换货天数：15 天」：
      后者在 6 个「时限」小节里逐字重复，锚点不唯一（加载器会直接抛异常）。
      ★ 这也说明了 gold 的一个**已知缺口**：平板/电脑/耳机/手机的「时限」
      小节因为内容逐字相同而无法单独锚定，所以那些题的 gold 只能靠
      品类正文（见 R-012 的 notes）。
    anchors:
      - text: 可换货天数：30 天
        doc_hint: 大家电售后规则 时限
      - text: 大家电退货需保留原包装，且需自行承担往返运费
        doc_hint: 大家电售后规则

  - question_no: R-007
    question: 耳机拆封了能退吗
    category: colloquial
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 入耳式耳机拆封后不支持无理由退货（卫生原因），但质量问题仍按三包处理；头戴式不影响二次销售可以退。
    notes: |
      ★ 这题的答案是**分叉的**（入耳式 vs 头戴式），而分叉的两半在
      两份切片里（规则正文 + 附加条件）。只召回一半的回答会给用户
      错误印象 —— 头戴式用户会以为自己退不了。
      ★ 卫生原因这个理由只在正文里写着，它是「为什么不能退」的解释，
      而用户问「能不能退」时往往真正想知道的就是这个「为什么」。
    anchors:
      - text: 出于卫生考虑，入耳式耳机拆封后不支持无理由退货
        doc_hint: 耳机类商品售后规则
      - text: 头戴式耳机不影响二次销售可退
        doc_hint: 耳机类商品售后规则 附加条件

  - question_no: R-008
    question: 智能手表的表带坏了算保修吗
    category: colloquial
    difficulty: 2
    intent: RETURN_EXCHANGE
    expected_answer: 不算。表带属于易耗品，不在整机保修范围内；但可在签收 7 天内因质量问题更换。
    notes: |
      ★ 用户问的是「算不算保修」，而语料给的是「不算，但 7 天内可以换」——
      **否定 + 例外**的形状。这是「部分回答」最容易翻车的题型：
      只说「不在保修范围」会漏掉用户能实际拿到的那条路。
      ⚠️ 标成 RETURN_EXCHANGE 而不是 WARRANTY：题眼是「换」，
      语料给的也是「签收 7 天内因质量问题更换」。按语料给的答案标，
      不按「表带/保修」这两个字的字面归类。★ 这条判断写在这里，
      因为它是本批次里最容易标错的题（另见 R-015 的同类判断）。
    anchors:
      - text: 表带属于易耗品，不在保修范围内
        doc_hint: 智能穿戴售后规则
      - text: 表带、充电线等配件不在整机保修范围内
        doc_hint: 智能穿戴售后规则 附加条件

  - question_no: R-009
    question: 退货的运费谁承担
    category: keyword
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 质量问题由平台承担，无理由退货由用户承担。
    notes: |
      同一个规则在语料里出现了**三次**（售后FAQ / 政策汇编 4.2 / 七天无理由政策），
      措辞各不相同 —— 售后FAQ 是「质量问题由平台承担，无理由退货由用户承担」，
      政策汇编 4.2 是「寄回运费由责任方承担：质量问题由平台承担，无理由退货由用户承担」。
      ★ 三条都标：任一条被召回都应该算对（这题是「答案被多份文档覆盖」的典型，
      也正是 docs/06 §2.2 偏差 B 的来源）。
      ⚠️ **第一版这里被加载器挡了一次**：锚点写的是 FAQ 那句答案原文，
      而它恰好是政策汇编 4.2 那句话的**子串** —— 一次命中 2 条（[18, 59]）。
      ★ 加载器的报错里给了两条出路，这里选了「换更独有的原文」而不是
      `allow_multiple: true`：FAQ 那一行的**问句**（「运费谁承担」）只属于它自己，
      用它做锚点最精确。★ 教训是**锚点要挑「只属于这一片」的字符串**，
      而答案原文不一定满足这一点 —— 因为它可能被另一份文档原样引用。
    anchors:
      - text: 运费谁承担
        doc_hint: 售后FAQ（用问句做锚点，见 notes：答案那句是另一片的子串）
      - text: 超时未寄回的申请将自动关闭
        doc_hint: 售后政策汇编 4.2 寄回与验收
      - text: 并附带发票或购买凭证
        doc_hint: 七天无理由退货政策

  - question_no: R-010
    question: 审核通过以后多久要把商品寄回去
    category: colloquial
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 审核通过后七天内寄回，超时未寄回的申请将自动关闭。
    notes: |
      ★ 「七天」这个数字在语料里至少有三个不同含义（无理由退货 7 天、
      寄回期限 7 天、智能穿戴表带换货 7 天）—— 这是**同一数字的三种语境**，
      召回错了不会报错，只会给用户一个错误的期限。
      这道题的主题就是「哪个七天」。
    anchors:
      - text: 超时未寄回的申请将自动关闭

  - question_no: R-011
    question: 换货需要满足什么条件
    category: keyword
    difficulty: 1
