  # ------------------------------------------------------------
  # 7.1 按场景选购 SCENARIO_PICK（12 题）   doc_types [1]
  #
  #   ★ 两种来源，本批各占一半：
  #     ① SP-001~006 —— **商品导购指南**的三个场景小节，
  #        答案是「这类人该看什么参数」的通用建议；
  #     ② SP-007~012 —— **商品详情**的「适用人群与场景」，
  #        答案是「这一款适合谁」的具体标签。
  #   ★ 这两半的差别正是这个叶子的定义所覆盖的两端：
  #     「某类人适合买什么」（①）与「这一款适合谁」（②）。
  #
  #   ★★★ 本片查出的一处**语料质量问题**（报告必须点名）：
  #   商品详情的「适用人群与场景」是从 10 个固定短语里随机取的，
  #   与「类目」**独立生成**，于是出现了语义荒谬的配对。实测：
  #     智能手表 × 适合长途通勤、降噪需求    4 款
  #     头戴式耳机 × 适合摄影爱好者、影像旗舰  3 款
  #     智能手环 × 适合游戏玩家、高性能需求    3 款
  #   ★ 为什么这要写进报告：它会让 **RAGAS 的 faithfulness 失真** ——
  #   一个如实回答「这款耳机适合摄影爱好者」的系统，在 judge 眼里
  #   像是胡说八道；而**如实回答才是对的**（忠实于语料）。
  #   ★ 本批只写**一道**这样的题（SP-009）：
  #   它足够暴露问题，又不会让答案质量指标被这类样本带偏。
  #   其余 5 道型号场景题都选语义自洽的配对。
  # ------------------------------------------------------------

  - question_no: SP-001
    question: 给长辈买手机要注意什么
    category: colloquial
    difficulty: 1
    intent: SCENARIO_PICK
    expected_answer: 重点看三件事：操作是否简单、字体够不够大、售后是否方便；屏幕 6.5 英寸以上、支持字体放大、电池 5000mAh 以上更省心。
    notes: |
      ★★ 语料把答案组织成「三件事 + 三条具体建议」，而**三条建议
      分散在同一小节的不同句子里**（屏幕尺寸/字体放大/简易模式/电池容量）——
      只答「操作简单、字大、售后方便」会漏掉用户真正能拿去比价的参数。
      ★ 这题与 SP-003（血压计）同片：那一节里讲了手机、家电、保健器械
      三类商品的建议，而它们**指向不同的品类** ——
      召回对了还要挑对品类（同 UG-007/UG-008 的「一片多小节」）。
    anchors:
      - text: 给长辈挑选礼物，重点考虑三件事：操作是否简单、字够不够大、售后是否方便
        doc_hint: 商品选购指南 1.1 适合送长辈的商品

