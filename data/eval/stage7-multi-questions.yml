    anchors:
      - text: 给长辈挑选礼物，重点考虑三件事
    notes: |
      ★★ 最后一轮「有什么推荐吗」**字面零信息** —— 没有品类、没有预算、
      没有人群。检索层拿这五个字去搜，什么都搜不到。
