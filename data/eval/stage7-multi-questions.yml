  # ==========================================================
  # 五、非业务追问（1 道）—— 主题本身不在业务范围内
  #
  # ★ 这一组只有一道，但它是整套里唯一能测出「澄清闸门在多轮下会挡错」的题。
  # ==========================================================

  - question_no: MT-020
    turns:
      - 帮我查一下明天的航班
      - 那后天呢
    standalone_question: 后天有哪些航班
    category: 非业务追问
    difficulty: 1
    intent: OUT_OF_SCOPE
    expect_no_retrieval: true
    expected_answer: 这个平台只处理商品导购与售后问题，查不了航班 —— 两轮都应当这样回答。不能因为第一轮被拒，就顺着「那后天呢」编一个航班出来，也不该把它当成「没说清要问什么」去反问。
    notes: |
      ★★ 这道题要观测的是一个**特定的失败模式**：分类器只看末轮那四个字
      （「那后天呢」），它眼里没有「天气」这个词 —— 所以它很可能判成
      「信息不足，该反问」（NEEDS_CLARIFICATION），而不是
      「不是我的业务」（OUT_OF_SCOPE）。

      这两个分支在意图树里是**互斥**的（CLAUDE.md 的硬约定：
      BUSINESS / OUT_OF_SCOPE / CLARIFY 三类互斥）。判错的后果很具体：
      用户问的是天气，收到的是「请问您想问哪款商品？」—— 答非所问，
      比直接拒绝还糟。

      ★ 所以这道题的 gold 是 OUT_OF_SCOPE，而它大概率会被判成
      NEEDS_CLARIFICATION。**那个错就是 ADR-046 在多轮下的代价**，
      而这是唯一能把它量出来的题。

      ⚠️ 只有一道是因为它的价值在「有没有」而不在「有几道」：
      多写几道同类的，只会让同一个结论在报告里重复出现，
      而每重复一道就多占一道题的预算。

      ⚠️⚠️ 主题从「天气」换成「航班」，是**改过一次**的，理由值得记：

        原稿   first「帮我看看明天天气」/ last「那后天呢」
               standalone「后天的天气怎么样」
               ✗ standalone 与少样本「今天天气怎么样」的相似度 **0.44** ——
                 而少样本那条正好是 OUT_OF_SCOPE 的样本（本题的 gold 也是它）。
                 这会让「单独问」的对照数被 prompt 抬高，
                 于是「追问 vs 单独问」的落差**被夸大** —— 结论方向反而是错的。

        ★ 换主题而不是改措辞，因为**任何**天气问法都会贴近那条少样本 ——
          它就是这个主题最自然的说法。躲不开的东西不要绕着写，
          换一个同样自然、同样明显超范围、而少样本里没有的主题。
          实测：「后天的航班」系列与全部 59 条少样本的最高相似度是 **0.07**。

      ★ 与少样本的逐字重合由 IntentFewShotTest 结构性拦截（它同时扫
      每一轮 turns）；但**近似**（0.44 这种）拦不住，只能靠这条备注记得
      跑 5.2 的相似度脚本。这是那一层护栏的已知边界。

      ✗ 被否掉的候选：「你们卖不卖生鲜」+「那我换个问法，你们有菜市场吗」
      （第二次追问里带着「菜市场」，字面有线索，测不出「零线索」那种情况）。
