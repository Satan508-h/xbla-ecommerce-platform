# ============================================================
# 阶段 7 评测集 —— 多轮题（7.1 批次 6）
#
# ★ 这一套【单独跑、单独一节、单独分母】。它不能和单轮那两套混算，
#   理由不是「麻烦」，是**范畴错误**（见下面第三节）。
#
# ------------------------------------------------------------
# 一、构造方式
#
#   source: corpus_driven_manual —— 和 stage7-questions.yml 同一种：
#   先通读语料，再想「用户会怎么问」，最后找锚点。
#
#   ⚠️ 但多轮题多了一道工序：**先想对话场景，再写追问句**。
#      而且被计分的只有【最后一轮】—— 前面几轮是布景。
#
#   与单轮集共同的偏差（报告里要写）：
#     · 标注者是 Claude（不是真人），审核是用户抽查
#     · 语料是仿真生成的，「用户会怎么问」是想出来的，不是采集来的
#     · 题从语料里长出来 —— 它测「语料里有的东西能不能被找到」，
#       不测「真实用户的分布长什么样」
#
# ------------------------------------------------------------
# 二、★★ 这一套要测什么：让「历史没被用上」这件事可见
#
#   写这一批题之前，把两条链路在代码里核了一遍：
#
#     ChatServiceImpl:177   intentClassifier.classify(question)      ← 只有这一句
#     ChatServiceImpl:213   retrievalPipeline.retrieve(question, …)  ← 也只有这一句
#
#   · 分类不看历史是【写在 ADR-046 里的决策】（5.2 的 95% 建立在它之上）
#   · **检索也不看历史** —— 这一条不在任何 ADR 里，是既成事实
#
#   ★★ 所以用户说「那它游泳能戴吗」时，检索层收到的是字面的这七个字，
#      一个「它」都解不开。这件事在阶段 5 没有任何东西能让它可见 ——
#      因为那时所有验证都是单轮的。
#
#   ★ 多轮题存在的【唯一】理由就是让它可见：
#       单轮题测   「这句话的意思能不能被找到」
#       多轮题测   「上一句话建立起来的那个东西，还在不在」
#
#   ⚠️ 因此这一套的检索数字天生比单轮那套难看。**那不是退化，是发现。**
#
# ------------------------------------------------------------
# 三、★★ gold 按【哪一句话】标 —— standalone_question
#
#   每道题的 intent / anchors / expected_answer 【全部按 standalone_question 标】，
#   而 standalone_question 是「把最后一轮单独说该怎么说」。
#
#   理由：用户真正想问的是那个意思，追问句只是它在上下文里的一种省略说法。
#   如果反过来按「分类器看到的那几个字」标 gold，这一套就退化成单轮集的副本 ——
#   它测的是「分类器知不知道自己缺信息」，而单轮集里那 6 道澄清题已经测过了。
#
#   按 standalone 标，报告里会得到两个有意义的数：
#     追问轮意图准确率  低   ← 每个点都能解释：分类器看不到「它」是什么
#     追问轮检索覆盖率  低   ← ★ 新发现：它第一次把「检索也不看历史」变成可测量
#
#   ★ 而「分类器实际输出了什么」是**观测**，不是 gold。scoring 时拿它跟 gold 比。
#
# ------------------------------------------------------------
# 四、★ 五种追问形态（category）—— 报告必须按这个维度切片
#
#   这一套的 category 轴和单轮那套【不是同一个轴】：
#     单轮集   keyword / model / colloquial  = 查询的【用词形态】
#     本题集   按【最后一轮携不携带主题信息】分五类 = 检索层能不能靠字面救回来
#
#   裸追问     最后一轮【不含】任何主题名词（「那还有别的要注意的吗」）
#              → 预测：检索层结构上不可能命中，分类层大概率判澄清
#   关键词追问 有指代词，但句子里还有一个主题关键词（「那退款会退到哪里」）
#              → 预测：检索层有机会命中（「退款」这个词还在）
#   换主体     最后一轮自带完整主体名词（「那大家电呢」）
#              → 预测：检索层应当正常
#   累积条件   最后一轮是泛问，主题全在前几轮（「有什么推荐吗」）
#              → 预测：检索层必然落空，只有生成层有可能答对
#   非业务追问 主题本身不在业务范围内（「那后天呢」）
#              → 预测：分类层应当判 OUT_OF_SCOPE，但看到的字面句毫无线索
#
#   ★★ 预测写在上面是为了**可以被证伪**。跑完第一次评测后，
#      如果「裸追问」的检索覆盖率不是接近 0，那说明我对链路的理解是错的 ——
#      那种情况比数字本身更重要，必须写进报告。
#
#   ⚠️⚠️ 一个必须先说清楚的**混杂**（不然「裸追问的意图准确率低」会被读错）：
#
#     少样本里那些澄清句（「还有别的吗」「多少钱」「它呢」…）本身就是
#     **最短、最泛指**的句子。而「裸追问」这一类要测的也正是这种句子 ——
#     两者在**类别层面**天然互相贴近，这不是哪一句写得不好，是结构如此。
#
#     ★ 逐句层面我已经压到最低：**全部 63 句用户话，与 59 条少样本的
#       最高字符二元组 Jaccard = 0.30，≥0.35 的 0 句**
#       （对照：单轮 159 句最高 0.45；baseline 20 句最高 0.29）。
#       ★ 但**类别层面的亲缘躲不掉** —— 把「那还有别的要注意的吗」改成
#       「还有哪些要注意的」只是把某一句压下去，它仍然是同一类句子。
#
#     ★★ 所以「裸追问被判成澄清」有两个同时成立的成因：
#         ① 分类器看不到历史（我们要测的那个）
#         ② 少样本刚教过它「这种短句要反问」（一个混杂项）
#       而两者的**症状完全一样**，从数据上分不开。
#
#     ★★ 报告里必须把这句话写在那个数字旁边，否则会把 ② 的贡献
#        算成 ① 的证据 —— 那就是用一个混杂过的数去论证架构问题。
#        能说的只有：「这一类句子的意图准确率是 X，而它的两个成因无法分离」。
#
#     ★ 逐字重合由 IntentFewShotTest 结构性拦截。
#       ⚠️ 但**近似**（0.3~0.5 这种）拦不住 —— 那一层目前只靠一条手跑脚本。
#       本批有 4 处近似是靠人眼发现的（MT-001/004/016/018/020），
#       其中 2 处落在**计分轮**上。这是那条护栏的已知边界。
#
# ------------------------------------------------------------
# 五、★ 会话语义（跑题器要件）
#
#   ★★ session_no 【不是】题库字段（写在这里会加载失败）。
#      会话由跑题器在每次 repeat 时**新建**：三个 repeat 用三个全新会话。
#      写进题库会让同一会话被反复复用 → repeat 之间串味（阶段 7 的 R7），
#      而症状是「多轮指标莫名其妙地好」—— 它看起来像好消息。
#
# ------------------------------------------------------------
# ★ 字段
#
#   question_no          唯一（跨全部题库文件）
#   turns                轮次，**至少两轮**，按时间顺序；最后一轮是【被计分那一轮】
#                        ★ 写 turns 就【不许】再写 question —— 两者都在会加载失败
#   standalone_question  「把最后一轮单独说该怎么说」= 本题 gold 的依据
#   category             五种形态之一（见第四节）
#   difficulty           1 易 / 2 中 / 3 难
#   intent               人工标注（standalone 那一句的意图）
#   anchors              锚点（standalone 那一句的检索目标）；工具/兜底题写
#                        expect_no_retrieval: true 且【不写】anchors
#   user_id              工具题的身份 —— 跑题器写进 X-Xbla-User-Id（ADR-054）
#   expected_answer      正确答案（针对最长的那一轮 = 最后一轮）
#   notes                为什么这么标 + 被否掉的候选
#
# ------------------------------------------------------------
# ★★ 写题纪律（与单轮集同）
#
#   写题期间【不跑检索】。允许的：查锚点在不在库里（机械检查）。
#   ✗ 不允许的：看这道题召回了什么、排第几。
#   理由：边写边看「能不能召回」就会不自觉地把问法改成「这个能召回的」，
#   那和「因为重排把它提上来了就补进 gold」是同一个错误（ADR-029），
#   只是方向相反 —— 评测从此不描述任何东西，而它看起来完全正常。
#
#   ⚠️ 例外记录：工具题的 expected_answer 是【直接调工具】看来的
#   （`/api/debug/mcp/call`，不花钱，走完整 MCP 链路）。那不是检索结果，
#   是正确答案本身 —— 从别处拿不到（见 docs/06 §2.2.1 的镜像）。
# ============================================================

# ★ 阶段 9.6 起，这个目录里每个 *.yml 都要先自报家门：
#   kind: bank = 题库（还要 question_set / source / annotated_by）
#   kind: gold = 判据/标注文件，不进任何指标
#   ⚠️ 不写 kind 会【当场报错】，没有「默认是题库」这回事 ——
#      成因是 9.5 的 recommend-gold.yml 让每一次 reload 都失败，
#      而报错内容指向的修法是错的。见 EvalQuestionLoader#KIND_BANK
kind: bank
question_set: stage7-multi
source: corpus_driven_manual
annotated_by: Claude 读语料手写；用户抽查

questions:

  # ==========================================================
  # 一、裸追问（4 道）—— 最后一轮不含任何主题名词
  #
  # ★★ 这一组是整套题里最锋利的地方：检索层拿到的那句话【字面零信息】，
  #    它能不能活下来完全取决于历史有没有被用上。
  # ==========================================================

  - question_no: MT-001
    turns:
      - 星辰 X1 用一会儿就发烫，正常吗
      - 还有哪些要注意的
    standalone_question: 星辰 X1 还有哪些常见问题要注意
    category: 裸追问
    difficulty: 2
    intent: USAGE_GUIDE
    expected_answer: 用户手册的「常见问题」一共三条，发热是其中一条：高负载场景下机身温度上升属于正常现象，建议避免边充电边玩大型游戏，并取下手机壳辅助散热。另外两条是——屏幕出现残影：OLED 屏幕长时间显示同一静态画面可能产生残影，建议开启自动亮度并缩短屏幕自动锁屏时间；无法充电：先检查充电器和数据线是否损坏，再清理充电接口的灰尘，若仍无法充电请联系售后服务。
    anchors:
      - text: 手机发热怎么办：高负载场景下机身温度上升属于正常现象
    notes: |
      ★ 为什么选它：最后一轮「还有哪些要注意的」**字面零主题** ——
      没有商品名、没有参数名、没有故障名。检索层只能拿这七个字去搜。
      正确答案（另外两条常见问题）完全靠第一轮建立的「星辰 X1 手册」这个主题。

      ⚠️ 末轮改过一次：原写「那还有别的要注意的吗」，与少样本「还有别的吗」
      相似度 **0.44**（全套最高）。改成「还有哪些要注意的」→ **0.10**。
      ★ 改的理由不是「0.44 一定不好」，而是：这一句是**计分轮**，
      而它的 gold 指望它被判成 USAGE_GUIDE —— 少样本那条是澄清句，
      相似度越高，「它被判成澄清」就越可能来自 prompt 而不是来自「看不到历史」。
      压低相似度**不能消除**类别层面的亲缘（见文件头那个「混杂」），
      但能让这个数少背一个可以避免的成因。

      ★★ 一个反直觉的细节：第一轮的答案（发热）和最后一轮的答案（残影、无法充电）
      **在同一片切片里**（chunk 70「常见问题」）。所以只要最后一轮能命中那一片，
      答案就齐了 —— 这道题把「检索失败」和「答不出来」拆开了。

      ✗ 被否掉的候选：「那屏幕残影是什么原因」（含「屏幕」「残影」两个主题词，
      变成关键词追问，测不出裸追问）；「那还有什么问题」（太短，像澄清题而非追问）。

  - question_no: MT-002
    turns:
      - 华为 Mate Ultra 电池多大
      - 两个说法不一样啊，到底哪个对
    standalone_question: 华为 Mate Ultra 的电池容量有两个说法，哪个是对的
    category: 裸追问
    difficulty: 3
    intent: SPEC_QUERY
    expected_answer: 商品页自己就有两个不一致的数：「卖点」和「商品描述」写的是 5000mAh，「规格参数 > 电池」写的是 5500mAh。没有任何文档规定两者冲突时以哪个为准，所以不能替它判定哪个对——比较稳妥的是以「规格参数」为准（它是结构化字段），并建议用户下单前找客服确认。
    anchors:
      - text: 华为 Mate Ultra > 卖点
      - text: 华为 Mate Ultra > 规格参数 > 电池
    notes: |
      ★★ 这道题是一次**全库扫描**的产物，不是读一篇文档看出来的。

      批量比对「卖点」里的电池数字与「规格参数 > 电池」里的数字，结果：
        19 款手机里，【11 款不一致】，偏差**恒为 500mAh** ——
        卖点一律写「5000mAh 大电池」，规格写 4500 或 5500。
        一致的 8 款，规格里没写数字的 0 款。

      这是一处**系统性**的语料缺陷（生成器的两个池子没对齐），
      而不是个别笔误。已知同类：SQ-016（4 台笔记本卖点说独立显卡、规格说集成显卡）。

      ★ 为什么锚点写成【两片】：正确答案本身是「指出这两处冲突」，
      所以模型必须【同时】看到 5000 和 5500 才答得出来。
      只召回一片，它就只看到一个数，会自信地报出来 —— 那正是最糟的答案。

      ⚠️ 为什么锚点用标题行（「华为 Mate Ultra > 卖点」）而不是正文：
      卖点那一行「5000mAh 大电池 / 超薄机身 7.8mm / 支持 66W 快充」在
      多个机型上高度相似，用正文锚点会命中多条（加载器会直接报错）。
      切片正文【包含**标题行**】，所以标题行是天然唯一的锚点。
      （同 data/eval/stage7-questions.yml 里型号题的锚点规则）

      ✗ 被否掉的候选：「那 5000 是从哪来的」——「5000」这个数字是题面暗示的，
      用户看不到商品页就不会这么问，属于**构造痕迹**（反推的痕迹写在问法里）。

  - question_no: MT-003
    turns:
      - 我有哪些优惠券
      - 那张能在买冰箱的时候用吗
    standalone_question: 我的优惠券能在买冰箱的时候用吗
    category: 裸追问
    difficulty: 2
    intent: MY_COUPON
    expect_no_retrieval: true
    user_id: 8
    expected_answer: 可以。你有一张可用的券——「家电品类满 8000 减 800」，限「家用电器」类目、订单满 8000 元可用、2026-10-19 到期。冰箱属于家用电器，类目对得上；但还要订单金额满 8000 元才能减 800。另外你还有一张已使用的「耳机品类立减 50」，那张已经用掉了。
    notes: |
      ★ 工具题（retrieval=TOOL），答案来自 query_my_coupons，不在知识库里 ——
      所以声明 expect_no_retrieval: true，不进检索指标的分母。

      ★★ 最后一轮「那张」是**纯指代**：优惠券的**类目、门槛、到期日**
      全都只存在于第一轮的答案里。而正确回答需要把「冰箱」映射到
      「家用电器」类目再和券的限制比 —— 这一步是领域推理，工具没做。

      ★ 一个诚实的观察：模型其实**可以**再调一次 query_my_coupons
      （它零参数）来重新拿到那张券，不依赖历史。所以这道题测的是
      「它知不知道要重新查 / 会不会凭记忆编」，而不是纯粹的指代消解。
      两条路都算对，只要最后答的是那张券的真实限制。

      ✗ 被否掉的候选：「那张什么时候过期」（只要读一个日期，太浅）；
      「还有别的券吗」（与第一轮几乎重复）。

  - question_no: MT-004
    turns:
      - 帮我查一下订单 SO202608010074
      - 那大概几天能送到
    standalone_question: 订单 SO202608010074 大概几天能送到
    category: 裸追问
    difficulty: 2
    intent: ORDER_STATUS
    expect_no_retrieval: true
    user_id: 8
    expected_answer: 查不到预计送达时间——工具返回的信息里没有这个字段，能给的只有「已发货、圆通速递、运单号 SF000000015822、发货时间 2026-08-01」。正确的做法是说明这个信息工具里没有，建议凭运单号去快递官网查询实时轨迹；不能替它编一个到货日期。
    notes: |
      ★★ 这道题考的是「**工具没给的东西不等于可以编**」。
      工具返回的是一段结构化文本，里面【没有】预计到达时间这个字段。
      一个流畅的客服式回答（「预计 3-5 天送达」）读起来毫无破绽，而它完全是编的。

      ★ 为什么最后一轮必须依赖历史：query_order_status 需要一个 order_no 参数，
      而**末轮句子里没有订单号**。模型要发起这次工具调用，只能从第一轮里取。
      工具参数只能由模型填（ADR-054 的另一面）—— 所以这是真正意义上的多轮依赖。

      ⚠️ 顺带发现（不进正确答案，只记在这里）：这笔订单 2026-08-01 发货，
      到写题的 2026-09-20 已经 50 天，状态仍停在「已发货」。
      种子数据里所有订单都不会自然流转到「已签收」，所以「已发货」是常态，
      **不能**把它当成异常去提示用户 —— 那会把一个数据问题说成物流问题。

      ⚠️ 另一处种子数据缺陷（全库扫描）：84 笔有物流信息的订单，
      运单号前缀**全部**是 SF，而承运商分布在中通/京东/圆通/顺丰四家。
      这道题的 expected_answer 只复述工具给的原样文本，不去解读前缀。

      ⚠️ 末轮改过一次：「那我大概什么时候能到」与少样本「退的钱什么时候能到」
      相似度 **0.42**，而那条是 **REFUND** 的样本 —— 本题 gold 是 ORDER_STATUS。
