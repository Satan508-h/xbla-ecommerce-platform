      「适合送长辈」这个标签被贴到了包括头戴降噪耳机、空调在内的各种商品上，
      所以**不能**用商品详情的那个标签去筛机型。指南那一段才是可靠的出处。
      这一条我写题时用一条 SQL 核过（贴该标签的商品横跨多个类目）。

      ✗ 被否掉的候选：「我想买个手机，有什么推荐吗」（两轮太短，
