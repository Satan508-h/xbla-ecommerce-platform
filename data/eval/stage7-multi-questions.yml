      有可能是被 prompt 带过去的，而不是因为看不到历史。两种成因症状一样。
      改成「那大概几天能送到」（与全部少样本最高 0.10）。
      ★ 改完反而更锋利：「几天能送到」是在**明确索要一个天数**，
      而工具里根本没有这个字段 —— 「不能编」这个考点从「隐性」变成了「显性」。

      ✗ 被否掉的候选：SO202607170111（已取消却有发货信息，是 TO-004 那处陷阱）——
      同一个陷阱不重复出题；那道题已经是单轮集里最锋利的一道。

