# ============================================================
# 阶段 9.6 评测集 —— 多轮澄清恢复（9.4 那一笔的判据）
#
# ★ 单独 run、单独一节、单独分母（ADR-084）。它【不能】和 stage7-multi 混算。
#
# ------------------------------------------------------------
# 一、这一套和 stage7-multi 要测的东西【不一样】
#
#   stage7-multi（阶段 7）     测「上一句话建立的那个东西还在不在」
#                              —— 首轮是**完整**的问题，末轮是带指代的追问
#   本套（阶段 9.6）           测「反问之后，系统能不能把话题接回来」
#                              —— 首轮是**信息不足**的问题，末轮是**补全**
#
#   ★ 两者的首轮性质相反，所以不能合并统计：
#     stage7-multi 的首轮【本来就该正常回答】，而本套的首轮【本来就该被反问】。
#     混在一起算「首轮回答率」会得到一个谁也解释不了的数。
#
# ------------------------------------------------------------
# 二、★★ 三层判据（本套的全部意义）
#
#   每一道的第 1 轮预期触发澄清反问，第 2 轮补上缺的那一格。三层：
#
#     ① 首轮反问发生了   status == 3
#        ⇒ 澄清闸门把住了吗
#     ② 末轮带上了状态   intent_plan.resumed == true
#        ⇒ 9.4 的「读后即清」生效了吗（pending_clarify 有没有真的被注入分类 prompt）
#     ③ 末轮落点对了     intent == gold
#        ⇒ 补全之后判对了吗
#
#   ★★ **三层全过**才是「这个任务解决了」。前两层是机制、第三层是结果。
#      ★ 分开报的理由很实际：坏掉时你得知道坏在哪一层，而三层的修法完全不同
#        （①调澄清闸门 / ②查 pending_clarify 的写入与清空 / ③调分类 prompt）。
#
#   ★★ 每道题都显式标了 `expect_clarify`（V17）—— 那是 ① 的 **gold**。
#
#      为什么必须显式标：多轮题的 `intent` 描述的是【末轮】（见第三节），
#      所以「首轮该不该反问」在题库里**原本没有任何字段回答得了**。
#      实测（2026-09-26，改题前）：8 道的首轮反问率 12/24 = 50%，
#      而其中 3 道【不反问是对的】—— 没有 gold 就分不出
#      「系统少反问了一次」和「我的场景前提不成立」，而这两件事一个要改闸门、
#      一个要改题。
#
#      ⚠️ 报告在没标时判 ① **不可判**，不猜：「唯一能猜的来源是 gold intent，
#      而它指末轮」⇒ 猜出来必然是「每一道都不该反问」，一个恒为 0 的「反问率」。
#
#      ★ 两个 `false` 的理由（其余六道都是 true）：
#        CL-001「这个还能退吗」—— 退货政策是通用的，商品不影响答案
#        CL-008「什么时候买便宜」—— 大促时点是通用规则，不依赖商品
#      这两道**本来就不该反问**：用户被无谓地打断也是一种错，而它和
#      「该反问没反问」的修法**相反**（一个调窄、一个调宽）。
#
# ------------------------------------------------------------
# 三、gold 按【哪一句话】标 —— standalone_question
#
#   本套沿用了 stage7-multi 的规矩：intent / anchors / expected_answer
#   【全部按 standalone_question 标】，即「把第 2 轮单独说该怎么说」。
#
#   ★ 理由和 stage7-multi 一样：用户真正想问的是那个意思，
#     补全的那一句只是它在「刚被反问过」这个上下文里的一种说法。
#
# ------------------------------------------------------------
# 四、★ 切片轴：缺的是【哪一个槽位】—— 与 9.4 的槽位词表同名
#
#   9.4 把槽位定为 product / purpose / category / budget
#   （`xbla.agent.slots.questions.*`，缺多个时按这个优先级只问一个）。
#   本套的 category 就用这四个值，于是「哪类槽位最容易接不住」是可切的。
#
#   ⚠️ **四个值的题数【刻意不平均】**（4 / 3 / 1 / 0 见下）：
#      缺商品是绝大多数场景的真实形态（「这个能退吗」），而
#      缺预算只在导购类里出现。为了凑数硬造会让题目失去真实性 ——
#      而这一套的 category 是【诊断轴】不是【配额表】。
#
# ------------------------------------------------------------
# 五、⚠️ 锚点全部【逐字复用】stage7-questions.yml 里已验证的唯一锚点
#
#   加载器要求锚点文本在库里【恰好命中一片】（命中 0 或 >1 都当场报错）。
#   手写新锚点要先扫库确认唯一性，而那几个锚点的正确性已经被
#   stage7 那两轮真实数据验证过 —— 复用它们是这一套最省风险的写法。
#   ★ 代价：CL-005 与 CL-006 的 gold 落在同一片切片上（见各自的 notes）。
#
# ------------------------------------------------------------
# 六、与其它几套共同的偏差（报告里要写）
#   · 标注者是 Claude（不是真人），审核是用户抽查
#   · 语料是仿真生成的，「用户会怎么问」是想出来的，不是采集来的
#   · 题从语料里长出来 —— 它测「语料里有的东西能不能被找到」，
#     不测「真实用户的分布长什么样」
# ============================================================

# ★ 阶段 9.6 起，这个目录里每个 *.yml 都要先自报家门：
#   kind: bank = 题库（还要 question_set / source / annotated_by）
#   kind: gold = 判据/标注文件，不进任何指标
#   ⚠️ 不写 kind 会【当场报错】，没有「默认是题库」这回事 ——
#      成因是 9.5 的 recommend-gold.yml 让每一次 reload 都失败，
#      而报错内容指向的修法是错的。见 EvalQuestionLoader#KIND_BANK
kind: bank
question_set: stage9-clarify-multi
source: corpus_driven_manual
annotated_by: Claude 读语料手写；用户抽查

questions:

  # ==========================================================
  # 一、缺商品（4 道）—— 「这个 / 它」指不到任何东西
  #
  # ★ 这是四类里最常见的一类：用户手上有东西，但没说是什么。
  # ==========================================================

  - question_no: CL-001
    turns:
      - 这个还能退吗
      - 就是包装盒已经扔了，还能退吗
    standalone_question: 包装盒扔了还能退货吗
    category: product
    expect_clarify: false   # 退货政策不依赖商品，这一句【不缺任何信息】
    difficulty: 1
    intent: RETURN_EXCHANGE
    expected_answer: 可以退，但原包装缺失要付包装费。售后政策写的是：拆封但未损坏包装的视为包装完整；无原包装的需支付包装费。所以「包装盒扔了」不影响退货资格，只是会产生一笔包装费。
    anchors:
      - text: 拆封但未损坏包装的视为包装完整
      - text: 无原包装的需支付包装费
    notes: |
      ★ 为什么这一道排第一：它是**最自然**的澄清场景 —— 「这个」没有任何
      指代对象，第二句话就把对象补上了。三层里最容易全过的一道，
      所以它同时是一个「机制有没有装歪」的哨兵。

      ★ 锚点两片：正确答案需要**同时**看到「视为完整」和「要付包装费」——
      只看前一片会答成「完全没问题」，漏掉费用。

  - question_no: CL-002
    turns:
      - 我这个还在保修期内吗
      - 是手机，是不是只保修一年
    standalone_question: 手机是不是只保修一年
    category: product
    expect_clarify: true   # 「我这个」没有指代对象，而且保修期取决于商品（整机/主要部件/家电各不相同）
    difficulty: 2
    intent: WARRANTY
    expected_answer: 不是只有一年。手机、笔记本电脑类商品享受整机一年、主要部件两年的保修服务。对照着看：家电是整机一年、核心部件三年。
    anchors:
      - text: 手机、笔记本电脑类商品享受整机一年、主要部件两年的保修服务
      - text: 手机笔记本整机一年主要部件两年；家电整机一年核心部件三年
    notes: |
      ★ 这是一道**用户前提就错了**的题：用户问「是不是只保修一年」，
      正确答案是「不是」。它测的是模型会不会顺着用户的前提答「对」。

      ★ 首轮「我这个还在保修期内吗」是**双重缺信息**：缺商品、
      也缺「你在问哪一类保修」。但 9.4 只问一个（按优先级取 product），
      所以这一道**不测**「缺多个时问得对不对」—— 那是 9.4 的单测在管的事。

  - question_no: CL-003
    turns:
      - 它值得买吗
      - 是海尔 GT Pro，我想买来送给我爸
    standalone_question: 海尔 GT Pro 适合送礼吗
    category: product
    expect_clarify: true   # 「它」指不到任何东西
    difficulty: 2
    intent: SCENARIO_PICK
    expected_answer: 答案在商品页的「适用人群与场景」那一节里 —— 这正是 SCENARIO_PICK 这个意图的定义：先检索导购指南与商品页，必要时再调工具比价。
    anchors:
      - text: 海尔 GT Pro > 适用人群与场景
    notes: |
      ★★ 首轮「它值得买吗」**逐字来自单轮集的 NC-001**（那 6 道澄清题之一）。
      刻意复用：那一句在本项目里有**实测**依据 —— 它在 stage7 里被判成
      NEEDS_CLARIFICATION。用别的说法是拿 ① 这一层去赌分类器的边界，
      而这一套题要测的是**恢复**，不是「哪句话会触发澄清」。

      ★ 末轮同时给出了商品名和用途，所以它落在 SCENARIO_PICK
      （购买决策）而不是 SPEC_QUERY（规格参数）—— 用户问的是「合不合适」。

  - question_no: CL-004
    turns:
      - 这个是不是坏了
      - 是充电，充到 80% 就变慢了
    standalone_question: 充电充到 80% 就变慢了是不是坏了
    category: product
    expect_clarify: true   # 「这个」指不到任何东西
    difficulty: 2
    intent: USAGE_GUIDE
    expected_answer: 不是坏了，这是正常的充电保护：电量达到百分之八十后会降低充电速度。
    anchors:
      - text: 会在电量达到百分之八十后降低充电速度
    notes: |
      ★ 首轮「这个是不是坏了」和 CL-003 的「它值得买吗」是**同一种病**：
      指代 + 没有对象。差别在末轮补出的信息指向不同意图 ——
      CL-003 是「买不买」（购买决策），这一道是「怎么回事」（使用操作）。

      ★ 这一道的末轮**不是完整句**（「是充电，充到 80% 就变慢了」没有主语）。
      这是刻意的：真实的补全常常就是这么说的，而分类器要能在
      「刚被反问过」的上下文里把它接住 —— 那正是 ② 那一层存在的意义。

  # ==========================================================
  # 二、缺类目（3 道）—— 说了要买什么，但没说买哪一类
  # ==========================================================

  - question_no: CL-005
    turns:
      - 想买点东西，有什么推荐吗
      - 主要是给学生用，想买台笔记本
    standalone_question: 学生党买笔记本什么价位合适
    category: category
    expect_clarify: true   # 「想买点东西」泛到没有任何品类
    difficulty: 1
    intent: SCENARIO_PICK
    expected_answer: 建议 4000 到 6000 元价位段。
    anchors:
      - text: 笔记本电脑选 4000 到 6000 元价位段
    notes: |
      ★ 首轮「想买点东西」是**纯泛化**：连品类都没有。这一道测的是
      分类器会不会因为「太泛」而判澄清 —— 而不是硬塞进某个叶子。

      ⚠️ **它的 gold 落在与 CL-006 同一片切片上**。这是复用已验证锚点的
      代价（见文件头第五节），不是笔误。两道的**入口对话完全不同**
      （一个缺类目、一个缺预算），所以它们测的是恢复路径的两条不同走法。

  - question_no: CL-006
    turns:
      - 预算 4000 到 6000，有推荐吗
      - 想买台给孩子学习用的笔记本，预算就 4000 到 6000
    standalone_question: 笔记本电脑预算 4000 到 6000 元该买什么
    category: budget
    expect_clarify: true   # 只有预算，没有品类
    difficulty: 2
    intent: SCENARIO_PICK
    expected_answer: 4000 到 6000 元这一段正是导购指南给笔记本的推荐价位，可以在这个区间里挑。
    anchors:
      - text: 笔记本电脑选 4000 到 6000 元价位段
    notes: |
      ★★ 首轮【改过一次】（2026-09-26）：原写「想买个笔记本，有推荐吗」——
      那一句**有类目就能导购，本来就不该反问**，所以它不是一个澄清场景。
      改成「预算 4000 到 6000」把类目拿掉，它才真的缺一格。
      ★ 这次改动是实测逼出来的：原首轮的第一轮反问率是 0，而它不是缺陷。

      ⚠️ 改了首轮之后**末轮也得跟着改**：`standalone_question` 的 gold 落在
      「笔记本电脑选 4000 到 6000 元价位段」那片切片上，所以**预算必须出现在末轮**
      —— 否则「把最后一轮单独说」的那句话里没有预算，而锚点却指望它有。
      改题时这一条最容易漏：首轮和末轮各改一半，两层判据各自都还是自洽的。

      ★ 唯一一道缺预算的题，而且是四类里题数最少的一类 —— **刻意的**：
      预算只在导购类意图上才是一个「缺了就没法答」的槽位。
      为了凑成平均的四类而硬造，会让这一套的 category 轴从
      「诊断哪一个槽位接不住」退化成「一张配额表」。

      ★ 注意末轮**只有一个数字**（「预算 4000 到 6000」），
      没有主语、没有动词。它比 CL-004 更极端 —— 而 ② 那一层就是为它存在的。

  - question_no: CL-007
    turns:
      - 有推荐的吗
      - 想买台笔记本，主要出差带着用
    standalone_question: 出差用的笔记本得多轻才合适
    category: purpose
    expect_clarify: true   # 四个字，没有指代、没有品类、没有用途
    difficulty: 2
    intent: SCENARIO_PICK
    expected_answer: 笔记本电脑建议选重量在 1.3 公斤以内、续航八小时以上的型号。
    anchors:
      - text: 笔记本电脑建议选重量在 1.3 公斤以内、续航八小时以上的型号
    notes: |
      ★★ 首轮只有四个字「有推荐的吗」—— **最短的一轮**。
      它把「信息不足」推到了极限：没有指代、没有品类、没有用途。
      分类器判它澄清是最自然的，而如果它被判成某个业务叶子，
      那说明分类器在**硬猜** —— 那正是 ① 要暴露的事。

      ★ 唯一一道缺 purpose 的题。和 CL-006 一样，题数少是刻意的。

  # ==========================================================
  # 三、缺类目 · 非导购意图（1 道）
  #
  # ★ 上面 7 道有三道落在 SCENARIO_PICK。这一道刻意换一个意图，
  #   用来分开两件事：「槽位恢复生效了」和「导购类题恰好答对了」。
  # ==========================================================

  - question_no: CL-008
    turns:
      - 什么时候买便宜
      - 想买手机，等大促是不是最划算
    standalone_question: 双十一买手机是不是最便宜
    category: category
    expect_clarify: false   # 大促时点是通用规则，不依赖商品
    difficulty: 3
    intent: PURCHASE_TIMING
    expected_answer: 从价格曲线看，这些时间点的价格通常是全年低点 —— 双十一在大促节点里，属于全年低点之一。
    anchors:
      - text: 这些时间点的价格通常是全年低点
    notes: |
      ★ 首轮「什么时候买便宜」**不含任何商品**，而且它问的是「时机」而不是
      「买什么」—— 所以它是四类里最容易被判成澄清的一道（缺 category）。

      ★★ 它的价值在于**换了一个意图**：如果这一套只有 SCENARIO_PICK 的题，
      那么「恢复机制生效了」和「导购类题本来就容易答对」就分不开 ——
      两个原因的修法完全不同（前者查 pending_clarify，后者调导购 prompt）。

      ★ difficulty 标 3：末轮补出来的「大促」是一个**时间概念**，
      不是商品概念，它跟首轮的「什么时候」才对得上。
