# ============================================================
# 「推荐工具」的合适性标注 —— 阶段 9.5 个性化的 A/B 判据
#
# ⚠️ 状态：**草案（draft）** —— 由 Claude 起草，**档位判定等人审**。
#    审过之后把 status 改成 reviewed 再拿它的数字进报告。
#
# ============================================================
# 一、为什么必须有它 —— 没有它，9.5 的 A/B 是个空虚的动作
#
# recommend_products 的候选里【同分商品占绝大多数】：
# 一个 need 下的候选全部命中同一个 suitable_for 句子，字面重合得分
# 完全相同（实测：送长辈 28 件、运动健身 19 件，全部 match_score = 3）。
#
# ⇒ 排序实际上【完全】由「偏好加分 + 商品编号」决定。
# ⇒ 所以「个性化有没有让它变好」这个问题，必须有一份与实现【正交】的
#    合适性判据才回答得了 —— 否则 A/B 只能证明「输出变了」。
#
# ============================================================
# 二、判据设计的三条纪律（★ 违反任何一条，这份 gold 就废了）
#
# ① 【只用 selling_points / category 两个字段，人工判】
#    ✗ 不用用户的历史（那是实现的三条特征之一，用了就是自证）
#    ✗ 不用实现的打分（那是循环论证）
#    ⇒ 允许、也【必须】使用商品资料本身 —— 判「送长辈合不合适」
#      本来就要读商品是干什么用的。
#
# ② 【按顺序判，先命中先定档】
#    一件商品可能同时带「睡眠分析」和「低延迟游戏模式」——
#    规则必须给出唯一结果，否则两个人标出两份 gold。
#
# ③ 【三档，且乙档是【中性】的】
#    ★★ 这一条最要紧：不确定的一律进乙档。
#    「我不确定」不应该变成一个信号 —— 把它摊进甲或丙，
#    测出来的就是标注者的犹豫，而不是系统的好坏。
#
# ============================================================
# ★★ 三、诚实性声明（必须跟着数字一起进报告）
#
# 1. **判据与实现正交，但不等于判据本身是「客观正确」的。**
#    它是**事先写下来、由人审过**的判定规则。正交的意思是
#    「判丙档用不到类目/品牌/价格量级那三条」——所以 A/B 不会被实现自证。
# 2. ★ **基线（profile.enabled=false）的输出是「id 升序」，没有任何语义。**
#    实测：同一个 need，四个不同用户的基线输出**逐字相同**。
#    ⇒ 这个 A/B 比的不是「两种排序哪个好」，而是
#      「**没有 tie-breaker** vs 有 tie-breaker」。
#      结论要照这个口径写，不要写成「比上一版好 X%」。
# 3. ★ **同一个 need 对不同用户，好坏方向可以相反**（实测就是这样）。
#    ⇒ 报告里必须**逐组合**报，不许只报一个总分 —— 一个平均值会把
#      「对 A 变好、对 B 变差」抹成「基本持平」。
# 4. **甲档的召回不是必要条件**：① 只有 top_n=3，甲档有 10 件时
#    本来就装不下；② 用户带着预算/类目来的时候候选池会变。
#    ⇒ 只在**同口径**（同 need、同 user、同 top_n）之间比。
# 5. ★★ **加分把候选收窄之后，组内【仍然同分】，最终由商品编号决定。**
#    实测（2026-09-25）：user 8 问「送长辈」时，4 分组**有 9 件**
#    （其中 4 件是甲档），而 id 升序取前三是两件笔记本 + 一件平板 ——
#    ★ **4 件甲档一件都没进来，只因为它们的编号更大**。
#    ⇒ reject@3 / hit@3 里有一部分是**编号巧合**，不是判据的功劳或过失。
#      所以配套脚本必须**连组内分布一起报**（`tie_group` 那个字段），
#      否则读的人会把「编号恰好排到了甲档」当成「个性化生效了」。
# 6. ★★★ **丙档的判定刻意不看 `suitable_for`，而工具的排序第一依据就是它**（2026-09-26）
#    本文件纪律 ① 排除那个字段的理由是【防自证】（它正是实现打分用的字段），
#    **不是**因为它不可信。⇒ 当一件商品的 `suitable_for` 与 category/卖点打架时，
#    判据与实现【必然】分歧 —— 而这与实现的优劣无关。
#    ★ 实测：语料里 `suitable_for` 是【跨类目随机撒】的
#      （`SeedDataFactory.java:276-278` 相邻两行，卖点按类目、它不按；
#       19/189 = 10.05% ≈ 1/10），于是 4 件家电带着「适合运动健身、防水防汗」。
#    ⇒ 「运动健身」那个 need 的负例（user 8 丙 3）里有一部分是这件事，不是排序错。
#      成因与五条候选修法的处置见 `docs/05` §9.12 ⑦ 第 4 条、`docs/10` 坑 50。
#    ⚠️ **别为了消掉这一格去改档位** —— 那会把「判据与实现刻意用不相交的证据」
#      这条立身之本拆掉，而 A/B 也就只剩「输出变了」这一个结论了。
#
# ============================================================
# 四、指标（配套脚本 = scripts/probe_recommend.py，口径与它一一对应）
#
#   reject@3    top_n 里落在【丙档】的条数   ← 主指标：明显不合适的【不能进来】
#   hit@3       top_n 里落在【甲档】的条数   ← 主指标：合适的进来了几件
#   changed     picks 序列和基线是否不同      ← 机制：偏好有没有生效
#   tie_group   ★★ 最高分组有几件 + 返回的几件在不在里面  ← 【必报，否则会误读】
#               理由见第三节第 5 条：收窄之后组内仍然同分，前三名由编号决定。
#               没有这一列，「甲档恰好被编号排进来」会被读成「个性化生效了」。
#               ⚠️ 「几件」来自工具返回的 `top_group_size` —— 它是在【完整】排序上
#                  算的，所以那个数准；而里面的甲/丙计数【只覆盖返回的 top_n 件】，
#                  并列组里还剩多少件甲档，脚本看不见（工具只返回 top_n 件）。
#                  ⇒ 脚本报的是「并列 N 件，返回的 k 件全在其中」+ ⚠️ 标记；
#                     k < N 时那个标记的含义是：换一条 tie-breaker 规则，
#                     这 k 件就可能不是这 k 件。
#   ★ 不报「总分」「平均分」——见第三节第 3 条。
#   ⚠️ 判据是【集合成员】，不是【名次】：甲档排第 3 和第 1 都算 1 条。
#      名次不进指标是因为基线那边名次本来就是 id 序（无意义），
#      拿一个无意义的基准去比名次会得出「提升了 2 位」这种假精确。
#
#   ★★ 两次运行（开关开 / 关）各存一个快照，`--compare` 才有结论：
#        python scripts/probe_recommend.py --out eval_results/recommend-profile-on.json
#        XBLA_AGENT_PROFILE_ENABLED=false ./mvnw spring-boot:run      # 关掉后重启
#        python scripts/probe_recommend.py --out eval_results/recommend-profile-off.json
#        python scripts/probe_recommend.py --compare ...-off.json ...-on.json
#      ⚠️ `--compare` 会拒绝「两边是同一侧」和「两份快照的 gold 不同版」——
#         这两种情况下那两张表**看起来完全正常**，但比出来的东西没有意义。
#
# ============================================================

version: 1
annotated_at: 2026-09-25
status: reviewed
used_by: 阶段 9.5 个性化（xbla.agent.profile.enabled 的 A/B）

# ------------------------------------------------------------
# ★★ 修订记录（每次改档位都要在这里留一行，并写清影响）
#
#   2026-09-25  ★★ 池子口径修正（写脚本时发现的，见第四节）：运动健身那个 need
#               原来写的是「适合运动健身、防水防汗」，而「适合」是【每一个】
#               suitable_for 的连续两字子串 ⇒ 工具按 ≥2 字判定时池子是【全部
#               189 件在售商品】，不是清单盖的那 19 件。
#               ⇒ 改用「运动健身」（实测 matched_count=30），并把甲档按【同一条规则】
#                 在完整池子上枚举：甲 4 → 15 件（多出来的 11 件全是
#                 「100+ 运动模式」的智能穿戴），丙 11 件不变（本来就完整）。
#               ⚠️ 这条修正【改变结论】—— 见 docs/05 §9.12 ⑧ 的表格。
#               教训：判据里的「池子」必须和工具实际搜的池子对得上是同一批商品，
#               否则 hit@3/reject@3 量的是「清单里有没有」而不是「合不合适」。
#
#   2026-09-25  人工审：丙档判定、组合选择确认；甲档【去掉「除菌除螨」】
#               （10 件 → 9 件，P000171 西门子移出）
#               ⇒ ★ 影响：修订前有【2 个】组合变好（user 15 多 2 件甲、
#                  user 29 多 1 件甲），修订后只剩 1 个（user 15 多 1 件），
#                  user 29 变成持平。也就是说【原来的档位判定在往好的方向偏】。
#                  数字见 docs/05 §9.12 ⑧ 的修订后表格。
#
# ⚠️ 这条记录本身就是这份 gold 的价值所在：档位是我判的，而一个
#    判得偏松的档位会让「个性化有效」这个结论凭空多出来两格。
#    ⇒ 任何一次改档位，都要重跑 ⑧ 那张表并把它贴出来，不能只改文件。
# ------------------------------------------------------------

# ------------------------------------------------------------
# need 一：送长辈、操作简单
#
# 候选池：suitable_for = 「适合送长辈、操作简单」的 28 件在售商品，
#         全部 product_no 形如 P000xxx，字面重合分**全部相同**（3 分）。
# ------------------------------------------------------------
needs:
- need: 送长辈
  call:
    need: 送长辈
    top_n: 3
  # ★★ 两个数是【两件事】，别混（第一版混过一次，见顶部修订记录）：
  #   matched_count   字面重合分 > 0 的商品数 ← 档位清单盖的就是它
  #   （工具还返回一个 candidate_count = 全部在售商品，实测 189 —— 池子本身）
  matched_count: 28
  # ★ 下面两个是 jia_list / bing_list 的【校验和】——
  #   scripts/probe_recommend.py 靠它确认自己没解析错，也对不上就当场失败
  #   （往清单里加一件但忘了改这两个数 = 报告上的「甲档 9 件」悄悄变成 10 件）
  jia_count: 9
  bing_count: 2
  tiers:
    # ★ 按 ①→②→③ 顺序判，先命中先定档
    bing: 卖点含「低延迟游戏模式」
    jia: 卖点含「睡眠分析 / 心率监测 / 血氧监测」（健康类），
         或含「静音运行 / 自清洁 / 一级能效」（家电省心类）
    yi: 其余
  jia_list:            # 9 件（7 件家电 + 2 件健康手表）
    - P000157   # 智能穿戴 苹果 1129  睡眠分析 / 心率监测 / 血氧监测
    - P000166   # 智能穿戴 华为 3169  睡眠分析 / 100+ 运动模式 / 心率监测
    - P000168   # 家用电器 戴森 8579  一级能效 / 除菌除螨 / APP 远程控制
    - P000173   # 家用电器 戴森 7909  除菌除螨 / 一级能效 / 自清洁
    - P000177   # 家用电器 小米 2839  APP 远程控制 / 静音运行 / 一级能效
    - P000184   # 家用电器 美的 4169  静音运行 / 一级能效 / 大容量
    - P000185   # 家用电器 戴森 4179  除菌除螨 / APP 远程控制 / 一级能效
    - P000193   # 家用电器 海尔 4679  自清洁 / 大容量 / 静音运行 / 除菌除螨
    - P000200   # 家用电器 格力 4869  智能联网 / APP 远程控制 / 自清洁 / 一级能效
  bing_list:           # 2 件（都是「游戏向」耳机）
    - P000102   # 耳机 Bose 249      低延迟游戏模式 / 空间音频
    - P000103   # 耳机 森海塞尔 609   低延迟游戏模式 / 空间音频 / IPX4
  # ⚠️ 两件被【移除】或【未纳入】的，都是刻意的，别顺手补回来：
  #    P000171 西门子 5819  「APP 远程控制 / 除菌除螨」—— 2026-09-25 人工审时
  #                        判定「除菌除螨」不算送长辈的合适理由 ⇒ 乙档
  #    P000198 西门子 9219  「大容量 / 智能联网」—— 贵价家电，但规则里没有
  #                        「贵 = 不合适」这一条。
  #    ★ 价格合不合适是【用户侧】的判断，掺进来就毁了正交性。
  #    ⚠️ 但这两件仍然会出现在候选里（其它档），它们只是【不加分】而已。

# ------------------------------------------------------------
# need 二：运动健身（30 件）
#
# ★ 这个 need 是第一个的【对照】：同一个卖点在这里会翻档 ——
#   「100+ 运动模式」在「送长辈」里是乙档，在这里是【甲档】。
#   ⇒ 它拦住「把 gold 做成一张关键词黑名单」那种偷懒写法。
#
# ★★ 池子口径（2026-09-25 修正，见顶部修订记录）：
#   调用词是「运动健身」而不是「适合运动健身、防水防汗」——
#   后者的「适合」是【每一个】suitable_for 的连续两字子串，
#   于是工具按字面重合（≥2 字）判定的池子是【全部 189 件在售商品】，
#   档位清单根本盖不住。用「运动健身」池子是 30 件（实测 matched_count=30），
#   清单就是在这 30 件上【按下面的规则机械枚举】的（SQL 可复算）。
#   ⚠️ 两条不在这 30 件里的：池子是按「三个字段里出现任意连续两字」算的，
#      所以有家电/笔记本进来（它们的卖点里有「运动」字样）——
#      那正是这个 need 的负向来源，也是 A/B 里「收窄推错方向」那一格。
# ------------------------------------------------------------
- need: 运动健身
  call:
    need: 运动健身
    top_n: 3
  matched_count: 30
  jia_count: 15
  bing_count: 11
  tiers:
    bing: 类目是 家用电器 或 笔记本电脑（和「运动健身」无关的大件），
          或卖点含「低延迟游戏模式」
    jia: 卖点含「100+ 运动模式」或「IPX4 防水」或「IP68 防水」
    yi: 其余
  jia_list:            # 15 件（1 手机 + 1 耳机 + 13 智能穿戴）
    - P000020   # 手机 荣耀 2829      1 亿像素主摄 / IP68 防水
    - P000114   # 耳机 小米 1339      IPX4 防水 / 主动降噪 45dB / 空间音频
    - P000136   # 智能穿戴 小米 1559  心率监测 / 血氧监测 / 100+ 运动模式
    - P000137   # 智能穿戴 苹果 2039  100+ 运动模式 / 血氧监测
    - P000138   # 智能穿戴 佳明 3169  100+ 运动模式 / 独立通话
    - P000140   # 智能穿戴 荣耀 529   100+ 运动模式 / 心率监测 / 血氧监测 / 14 天续航
    - P000143   # 智能穿戴 荣耀 3009  心率监测 / 100+ 运动模式
    - P000144   # 智能穿戴 华为 1679  睡眠分析 / 心率监测 / 100+ 运动模式 / 血氧监测
    - P000151   # 智能穿戴 佳明 2699  14 天续航 / 独立通话 / 100+ 运动模式
    - P000154   # 智能穿戴 佳明 2559  100+ 运动模式 / 独立通话
    - P000155   # 智能穿戴 佳明 2089  100+ 运动模式 / 独立通话
    - P000156   # 智能穿戴 小米 719   睡眠分析 / 独立通话 / 100+ 运动模式 / 心率监测
    - P000161   # 智能穿戴 华为 2589  14 天续航 / 血氧监测 / 100+ 运动模式
    - P000165   # 智能穿戴 华为 3209  100+ 运动模式 / 独立通话 / 心率监测 / 血氧监测
    - P000166   # 智能穿戴 华为 3169  睡眠分析 / 100+ 运动模式 / 心率监测
  bing_list:           # 11 件（5 笔记本 + 2 游戏耳机 + 4 家电）
    - P000041   # 笔记本电脑 苹果 9689
    - P000042   # 笔记本电脑 华硕 5229
    - P000043   # 笔记本电脑 戴尔 7649
    - P000046   # 笔记本电脑 联想 13949
    - P000057   # 笔记本电脑 联想 8769
    - P000124   # 耳机 小米 1339      低延迟游戏模式 / 通话降噪
    - P000132   # 耳机 森海塞尔 2369   低延迟游戏模式 / IPX4 防水
