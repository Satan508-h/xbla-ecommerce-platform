# ============================================================
# 五、组合：为什么挑这四个人（★ 选人理由，不是判据）
#
# 挑人的判据只有一条：**他们的历史能不能把结果推向不同的方向**
#   （不然 A/B 测的是「同一个人身上有没有变化」，那太弱）
#
#   user 8   家电×3 / 笔记本×2 / 平板 / 耳机；联想×2、华为、戴森、海尔、索尼、西门子
#   user 15  笔记本×2 / 家电×2 / 耳机；戴尔、Bose、苹果、美的、西门子
#   user 26  平板×2 / 耳机 / 穿戴 / 家电；三星、Bose、佳明、荣耀、格力
#   user 29  手机×3 / 家电 / 耳机；华为×2、vivo、西门子、索尼
#
# ⇒ 四个人在【家电 / 笔记本 / 平板 / 手机】四个方向上各占一个，
#   而「送长辈」的甲档 10 件里 8 件是家电 —— 于是必然有人被推向甲档、
#   有人被推离甲档。这正是要测的东西。
# ============================================================
combos:
